  /* Street lighting, in the only surface that has any: the grid dims by day
     and comes up after dark. */
  '  col += vec3(0.10,0.42,0.62) * 0.12 * (g1 + g2) * near * (1.0 + uWet * 1.9) * (0.62 + 0.55 * uNight);',
  '  col += vec3(0.04,0.20,0.34) * uWet * near * 0.22 * (0.5 + 0.5 * sin(vW.x * 0.55 + uTime * 1.4));',
  '  col = mix(col, mix(vec3(0.19,0.21,0.21),vec3(0.035,0.045,0.055),uNight), road * 0.92);',
  /* kerbs: brightest exactly at the road edge, and they come up after dark */
  '  col += vec3(0.06,0.34,0.52) * (road * (1.0 - road) * 0.5) * (0.5 + 0.55 * uNight);',
  /* centre lines, dashed, and never through a junction */
  '  float dashX = roadX * (1.0 - junction) * (1.0 - smoothstep(0.26, 0.5, lx)) * step(0.55, fract(vW.z / 8.0));',
  '  float dashZ = roadZ * (1.0 - junction) * (1.0 - smoothstep(0.26, 0.5, lz)) * step(0.55, fract(vW.x / 8.0));',
  '  col += vec3(0.44,0.38,0.22) * (dashX + dashZ) * 0.8;',
  /* wet tarmac reflects the length of the street */
  '  col += vec3(0.05,0.26,0.42) * road * uWet * 0.4 * (0.5 + 0.5 * sin(vW.z * 0.85 + uTime * 2.1));',
  '  col += vec3(0.05,0.30,0.50) * smoothstep(400.0, 0.0, rr) * 0.10;',
  '  float ring = abs(sin(rr * 0.02 - uTime * 0.35));',
  '  col += vec3(0.06,0.34,0.52) * pow(ring, 42.0) * 0.0 * smoothstep(430.0, 60.0, rr);',
  '  float fog = 1.0 - exp(-pow(vDepth * uFogK, 2.0));',
  '  col = mix(col, uFog, clamp(fog, 0.0, 1.0));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

/* Trees. `aPart` is 1 on canopy vertices and 0 on the trunk (same merge
   helper the agent body uses), which buys two things off one attribute: the
   per-instance spread that turns one geometry into fat and thin trees, and a
   sway that moves leaves without moving the trunk. */
SH.treeVert = [
  'attribute float aPart; attribute float aSpread; attribute float aSeed; attribute vec3 aTint;',
  'uniform float uTime;',
  'varying vec3 vN; varying vec3 vTint; varying float vCan; varying float vDepth;',
  'void main(){',
  '  vCan = aPart; vTint = aTint;',
  '  vec3 p = position;',
  '  p.xz *= mix(1.0, aSpread, aPart);',
  '  float sway = sin(uTime * 0.85 + aSeed * 41.0) * 0.045 * aPart * max(0.0, p.y - 0.8);',
  '  p.x += sway; p.z += sway * 0.62;',
  '  #ifdef USE_INSTANCING',
  '    vec4 ip = instanceMatrix * vec4(p,1.0);',
  '    vN = normalize(mat3(instanceMatrix) * normal);',
  '  #else',
  '    vec4 ip = vec4(p,1.0); vN = normal;',
  '  #endif',
  '  vec4 mv = modelViewMatrix * ip; vDepth = -mv.z;',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');

/* Deliberately dim: the brightest a canopy gets is well under the 0.42
   bright-pass threshold, so trees never bloom and never compete with the
   six state hues for attention. They are the dark the neon reads against. */
SH.treeFrag = [
  'precision highp float;',
  'uniform vec3 uFog; uniform float uFogK;',
  'varying vec3 vN; varying vec3 vTint; varying float vCan; varying float vDepth;',
  'void main(){',
  '  vec3 L = normalize(vec3(0.42, 1.0, 0.55));',
  '  vec3 n = normalize(vN);',
  '  float nd = max(0.0, dot(n, L));',
  '  float rim = pow(1.0 - max(0.0, n.y), 3.0);',
  '  vec3 col = vTint * (0.16 + 0.60 * nd) + vTint * rim * 0.42;',
  '  col *= mix(0.45, 1.0, vCan);',
  '  float fog = 1.0 - exp(-pow(vDepth * uFogK, 2.0));',
  '  col = mix(col, uFog, clamp(fog, 0.0, 1.0));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

SH.waterVert = [
  'varying vec2 vUv; varying vec3 vW; varying float vDepth;',
  'void main(){ vUv = uv;',
  '  vec4 wp = modelMatrix * instanceMatrix * vec4(position,1.0); vW = wp.xyz;',
  '  vec4 mv = viewMatrix * wp; vDepth = -mv.z;',
  '  gl_Position = projectionMatrix * mv; }'
].join('\n');

/* Water in a neon city is mostly what it REFLECTS, so this is a dark base with
   moving light on it, not a blue surface with waves drawn on top.

   Ripples are sampled in WORLD space rather than in uv. Sampling along uv ties
   the wave frequency to the size of the mesh, so a big pond and a small one
   ripple at different scales and both shimmer into moire at distance. World
   space means a ripple is the same size everywhere, which is the whole
   difference between water and tinsel. */
SH.waterFrag = [
  'precision highp float;',
  'uniform float uTime; uniform vec3 uFog; uniform float uFogK;',
  'varying vec2 vUv; varying vec3 vW; varying float vDepth;',
  'void main(){',
  /* radial, because a pond has a shore all the way round */
  '  float across = clamp(length(vUv - 0.5) * 2.0, 0.0, 1.0);',
  '  float bank = smoothstep(0.74, 0.99, across);',
  '  vec2 w = vW.xz;',
  '  float t = uTime * 0.42;',
  '  float h = sin(w.x * 0.30 + t) * 0.50',
  '          + sin(w.y * 0.41 - t * 0.77) * 0.32',
  '          + sin((w.x + w.y) * 0.63 + t * 1.5) * 0.19',
  '          + sin((w.x - w.y * 0.6) * 1.05 - t * 2.1) * 0.11;',
  '  vec3 col = vec3(0.005,0.018,0.036);',
  /* grazing angles brighten: the single cue that reads as a liquid surface */
  '  vec3 V = normalize(cameraPosition - vW);',
  '  float fres = pow(1.0 - clamp(abs(V.y), 0.0, 1.0), 4.0);',
  '  col += vec3(0.045,0.26,0.44) * fres * 0.62;',
  '  col += vec3(0.05,0.30,0.48) * smoothstep(0.30, 1.05, h) * 0.30;',
  '  col += vec3(0.60,0.88,1.00) * pow(smoothstep(0.88, 1.05, h), 3.0) * 0.30;',
  '  float shore = smoothstep(0.52, 0.74, across) * (1.0 - bank);',
  '  col += vec3(0.10,0.40,0.58) * shore * (0.38 + 0.26 * sin(w.x * 1.3 + t * 2.6));',
  '  col = mix(col, vec3(0.017,0.026,0.045), bank);',
  '  col += vec3(0.06,0.32,0.50) * (bank * (1.0 - bank)) * 1.9;',
  '  float fog = 1.0 - exp(-pow(vDepth * uFogK, 2.0));',
  '  col = mix(col, uFog, clamp(fog, 0.0, 1.0));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

SH.quadVert = [
  'varying vec2 vUv;',
  'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
].join('\n');

SH.brightFrag = [
  'precision highp float;',
  'uniform sampler2D tSrc; uniform float uThresh; uniform float uKnee;',
  'varying vec2 vUv;',
  'void main(){',
  '  vec3 c = texture2D(tSrc, vUv).rgb;',
  '  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
  '  float s = smoothstep(uThresh, uThresh + uKnee, l);',
  '  gl_FragColor = vec4(c * s, 1.0);',
  '}'
].join('\n');

SH.blurFrag = [
  'precision highp float;',
  'uniform sampler2D tSrc; uniform vec2 uDir;',
  'varying vec2 vUv;',
  'void main(){',
  '  vec3 sum = texture2D(tSrc, vUv).rgb * 0.2270270270;',
  '  sum += texture2D(tSrc, vUv + uDir * 1.3846153846).rgb * 0.3162162162;',
  '  sum += texture2D(tSrc, vUv - uDir * 1.3846153846).rgb * 0.3162162162;',
  '  sum += texture2D(tSrc, vUv + uDir * 3.2307692308).rgb * 0.0702702703;',
  '  sum += texture2D(tSrc, vUv - uDir * 3.2307692308).rgb * 0.0702702703;',
  '  gl_FragColor = vec4(sum, 1.0);',
  '}'
].join('\n');

SH.compositeFrag = [
  'precision highp float;',
  'uniform sampler2D tSrc; uniform sampler2D tBloomA; uniform sampler2D tBloomB;',
  'uniform float uStrength; uniform float uTime;',
  'varying vec2 vUv;',
  'vec3 aces(vec3 x){',
  '  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);',
  '}',
  'void main(){',
  '  vec3 base = texture2D(tSrc, vUv).rgb;',
  '  vec3 bl = texture2D(tBloomA, vUv).rgb * 0.62 + texture2D(tBloomB, vUv).rgb * 0.85;',
  '  vec3 col = base + bl * uStrength;',
  '  vec2 d = vUv - 0.5;',
  '  col *= 1.0 - dot(d, d) * 0.72;',
  '  float scan = 0.985 + 0.015 * sin(vUv.y * 1400.0 + uTime * 2.0);',
  '  col *= scan;',
  '  col = aces(col * 1.06);',
  '  col = pow(col, vec3(1.0 / 2.2));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

/* =====================================================================
   /buildings
   ===================================================================== */
/* Storeys are the city's one shared unit of measure. They used to be computed
   inside the tower loop, which is why only the 29 towers agents work in had an
   inside and the other six hundred buildings were solid shells. Hoisted, so a
   filler block and a landmark are floored by the same rule and a change lands
   in one place — the slab mesh, the lift, the agent's interior slot and the
   "floor 3 of 7" readout all still resolve to these two numbers. */
var FLOOR_H = 4.2, FLOOR_Y0 = 1.6;
function floorsFor(h, min) {
  return Math.max(min || 1, Math.floor((h - FLOOR_Y0 - 2) / FLOOR_H));
}

function buildCity(rnd) {
  var sites = [], boxes = [];
  function occupied(x, z, pad) {
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (Math.abs(x - b.x) < (b.w * 0.5 + pad) && Math.abs(z - b.z) < (b.d * 0.5 + pad)) return true;
    }
    return false;
  }
  DISTRICTS.forEach(function (D, di) {
    var tint = new T.Color(D.col);
    var nSites = D.key === 'core' ? 4 : 5;
    for (var k = 0; k < nSites; k++) {
      var ang = (k / nSites) * Math.PI * 2 + di * 0.7;
      var rad = D.r * 0.62;
      var h = 22 + rnd() * 26 + (D.key === 'core' ? 16 : 0);
      var w = 9 + rnd() * 5, d = 9 + rnd() * 5;
      /* A tower's position is fixed by its district, so it cannot simply be
         rejected off a carriageway — it gets pushed clear instead. */
      var sx = offLane(D.x + Math.cos(ang) * rad, w * 0.5 + 1);
      var sz = offLane(D.z + Math.sin(ang) * rad, d * 0.5 + 1);
      /* Storeys are real: an agent stands on one, walks around it, and steps
         up to the next as its task progresses. A tower keeps a floor of 2 so a
         short one is never a single-storey shed with a spinning ring on top. */
      var nf = floorsFor(h, 2);
      boxes.push({ x: sx, z: sz, w: w, d: d, h: h, tint: tint, seed: rnd(),
                   site: sites.length, floors: nf });
      sites.push({
        x: sx, z: sz, h: h, r: Math.max(w, d) * 0.5, w: w, d: d,
        district: di, bias: D.bias, col: D.col,
        floors: nf, floorH: FLOOR_H, floorY: FLOOR_Y0,
        label: D.name.split(' / ')[0] + ' · ' + String.fromCharCode(65 + k),
        boxIndex: boxes.length - 1
      });
    }
    var fill = D.key === 'core' ? 30 : 42;
    for (var f = 0; f < fill; f++) {
      for (var attempt = 0; attempt < 12; attempt++) {
        var a2 = rnd() * Math.PI * 2;
        var r2 = D.r * (0.30 + Math.sqrt(rnd()) * 0.98);
        var bx = D.x + Math.cos(a2) * r2, bz = D.z + Math.sin(a2) * r2;
        var bw = 5 + rnd() * 7, bd = 5 + rnd() * 7;
        bx = offLane(bx, bw * 0.5 + 1);
        bz = offLane(bz, bd * 0.5 + 1);
        if (onLane(bx, bz, bw * 0.5, bd * 0.5)) continue;   /* belt to that brace */
        if (occupied(bx, bz, 2.6)) continue;
        var near = 1 - Math.min(1, r2 / (D.r * 1.3));
        var bh = 6 + rnd() * 20 + near * 30;
        boxes.push({ x: bx, z: bz, w: bw, d: bd, h: bh, tint: tint, seed: rnd(),
                     floors: floorsFor(bh) });
        break;
      }
    }
  });
  var cold = new T.Color(0x24425f);
  var outskirts = MOBILE ? 200 : 430;
  for (var o = 0; o < outskirts; o++) {
    for (var at = 0; at < 10; at++) {
      var ang2 = rnd() * Math.PI * 2;
      var rr = 150 + Math.sqrt(rnd()) * 250;
      var ox = Math.cos(ang2) * rr, oz = Math.sin(ang2) * rr * 0.92;
      var ow = 6 + rnd() * 10, od = 6 + rnd() * 10;
      ox = offLane(ox, ow * 0.5 + 1);
      oz = offLane(oz, od * 0.5 + 1);
      if (onLane(ox, oz, ow * 0.5, od * 0.5)) continue;
      if (occupied(ox, oz, 3.2)) continue;
      var oh = 5 + rnd() * 34;
      boxes.push({ x: ox, z: oz, w: ow, d: od, h: oh, tint: cold, seed: rnd(),
                   floors: floorsFor(oh) });
      break;
    }
  }

  /* ---- green space ----
     Placement is the whole design here; the mesh is trivial. Parks fill the
     gaps the districts leave, and plant() is handed back so trees can also be
     strung along the real route curves later — that way nothing outside
     buildRoutes() has to know the ring order the routes are built from. */
  var trees = [], parks = [], ponds = [];
  /* Parks may overlap, so a later park's pond can land on an earlier park's
     trees. Water goes in after they are planted, so it has to check. */
  function treeIn(x, z, r) {
    for (var q = 0; q < trees.length; q++) {
      if (Math.hypot(trees[q].x - x, trees[q].z - z) < r) return true;
    }
    return false;
  }
  function inPond(x, z, pad) {
    for (var q = 0; q < ponds.length; q++) {
      var P = ponds[q];
      if (Math.hypot(x - P.x, z - P.z) < P.r + (pad || 0)) return true;
    }
    return false;
  }
  function clearOfDistricts(x, z, k) {
    for (var q = 0; q < DISTRICTS.length; q++) {
      var Dq = DISTRICTS[q];
      if (Math.hypot(x - Dq.x, z - Dq.z) < Dq.r * k) return false;
    }
    return true;
  }
  function plant(x, z, scale) {
    /* Trees stay off the carriageway too. A lane is only guaranteed walkable
       because NOTHING is ever put in one. */
    if (onLane(x, z, 1.8)) return false;
    if (inPond(x, z, 1.2)) return false;
    if (occupied(x, z, 2.4)) return false;
    trees.push({ x: x, z: z, s: scale, kind: rnd() < 0.42 ? 1 : 0,
                 spread: 0.76 + rnd() * 0.72, rot: rnd() * 6.283, seed: rnd() });
    return true;
  }
  var nParks = MOBILE ? 9 : 16;
  for (var pk = 0; pk < nParks; pk++) {
    for (var pa = 0; pa < 26; pa++) {
      var pang = rnd() * Math.PI * 2;
      var prad = 54 + Math.sqrt(rnd()) * 138;
      var px = Math.cos(pang) * prad, pz = Math.sin(pang) * prad;
      if (!clearOfDistricts(px, pz, 1.04)) continue;
      if (occupied(px, pz, 13)) continue;
      var prr = 11 + rnd() * 9;
      parks.push({ x: px, z: pz, r: prr });
      /* Most parks get water. Decided BEFORE the trees go in so the planting
         test can keep them out of it.
         A park is 11-20 across and the blocks are 22, so every park straddles a
         carriageway — the pond has to be small enough to fit the band between
         the kerb and the next block, and offset until it finds one. The offset
         is bounded so the pond can never escape its own park. A park with
         nowhere dry to put one simply does not get a pond. */
      if (rnd() < 0.75) {
        var pr2 = Math.min(5, prr * (0.22 + rnd() * 0.16));
        var maxOff = Math.max(0, prr - pr2 - 0.6);
        for (var pt2 = 0; pt2 < 22; pt2++) {
          var oa2 = rnd() * 6.283, or2 = Math.sqrt(rnd()) * maxOff;
          var cx2 = px + Math.cos(oa2) * or2, cz2 = pz + Math.sin(oa2) * or2;
          if (onLane(cx2, cz2, pr2 + 0.6)) continue;
          if (occupied(cx2, cz2, pr2 + 0.6)) continue;
          if (treeIn(cx2, cz2, pr2 + 0.4)) continue;
          ponds.push({ x: cx2, z: cz2, r: pr2 });
          break;
        }
      }
      var want = 11 + ((rnd() * 14) | 0);
      for (var tk = 0; tk < want; tk++) {
        /* A park straddles at least one carriageway at this block pitch, so a
           single attempt per tree loses a third of every park. */
        for (var ta2 = 0; ta2 < 5; ta2++) {
          var ta = rnd() * Math.PI * 2, trd = Math.sqrt(rnd()) * prr * 0.9;
          if (plant(px + Math.cos(ta) * trd, pz + Math.sin(ta) * trd, 0.85 + rnd() * 0.8)) break;
        }
      }
      break;
    }
  }
  /* Green BETWEEN the blocks, not only in the sixteen parks. Small patches
     wherever a block has room left over is what stops a city reading as
     concrete with three gardens in it. */
  var GREENS = MOBILE ? 110 : 260;
  for (var gk = 0; gk < GREENS; gk++) {
    for (var ga = 0; ga < 32; ga++) {
      var gang = rnd() * Math.PI * 2, grad = 22 + Math.sqrt(rnd()) * 250;
      var gx = Math.cos(gang) * grad, gz = Math.sin(gang) * grad;
      var gr = 2.4 + rnd() * 5.4;
      if (onLane(gx, gz, gr + 1)) continue;
      if (occupied(gx, gz, gr + 1.6)) continue;
      parks.push({ x: gx, z: gz, r: gr });
      var gn = 2 + ((rnd() * 3) | 0);
      for (var gt = 0; gt < gn; gt++) {
        var gta = rnd() * 6.283, gtr = Math.sqrt(rnd()) * gr * 0.78;
        plant(gx + Math.cos(gta) * gtr, gz + Math.sin(gta) * gtr, 0.7 + rnd() * 0.6);
      }
      break;
    }
  }

  return { boxes: boxes, sites: sites, trees: trees, parks: parks, ponds: ponds, plant: plant };
}

/* A thin line of trees down both verges of every route, so the walk between
   districts is not bare deck. Reads the curves themselves rather than the
   district ring, so adding a district cannot desynchronise it. */
function plantVerges(routes, city, rnd) {
  var step = MOBILE ? 0.11 : 0.062;
  var pt = new T.Vector3(), tg = new T.Vector3();
  routes.forEach(function (R) {
    for (var t = 0.11; t < 0.9; t += step) {
      R.curve.getPoint(t, pt);
      R.curve.getTangent(t, tg);
      var nx = -tg.z, nz = tg.x, len = Math.hypot(nx, nz) || 1;
      nx /= len; nz /= len;
      for (var side = -1; side <= 1; side += 2) {
        for (var att = 0; att < 3; att++) {
          var off = side * (5.6 + rnd() * 4.6);
          if (city.plant(pt.x + nx * off, pt.z + nz * off, 0.8 + rnd() * 0.55)) break;
        }
      }
    }
  });
}

function makeBuildingMesh(boxes) {
  var geo = new T.BoxGeometry(1, 1, 1);
  var n = boxes.length;
  var mat = new T.ShaderMaterial({
    vertexShader: SH.buildingVert, fragmentShader: SH.buildingFrag,
    uniforms: { uTime: { value: 0 }, uFog: { value: new T.Color(0x050a15) },
                uFogK: { value: 0.0031 }, uNight: { value: 1 } },
    extensions: { derivatives: true }
  });
  var mesh = new T.InstancedMesh(geo, mat, n);
  mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
  var aSeed = new Float32Array(n), aBusy = new Float32Array(n), aOpen = new Float32Array(n);
  var aScale = new Float32Array(n * 3), aTint = new Float32Array(n * 3);
  var m = new T.Matrix4(), q = new T.Quaternion(), p = new T.Vector3(), sc = new T.Vector3();
  for (var i = 0; i < n; i++) {
    var b = boxes[i];
    p.set(b.x, b.h * 0.5, b.z); sc.set(b.w, b.h, b.d);
    m.compose(p, q, sc);
    mesh.setMatrixAt(i, m);
    aSeed[i] = b.seed;
    aScale[i * 3] = b.w; aScale[i * 3 + 1] = b.h; aScale[i * 3 + 2] = b.d;
    aTint[i * 3] = b.tint.r; aTint[i * 3 + 1] = b.tint.g; aTint[i * 3 + 2] = b.tint.b;
  }
  geo.setAttribute('aSeed', new T.InstancedBufferAttribute(aSeed, 1));
  geo.setAttribute('aBusy', new T.InstancedBufferAttribute(aBusy, 1));
  geo.setAttribute('aOpen', new T.InstancedBufferAttribute(aOpen, 1));
  geo.setAttribute('aScale', new T.InstancedBufferAttribute(aScale, 3));
  geo.setAttribute('aTint', new T.InstancedBufferAttribute(aTint, 3));
  mesh.frustumCulled = false;
  mesh.userData.aBusy = geo.attributes.aBusy;
  mesh.userData.aOpen = geo.attributes.aOpen;
  return mesh;
}

/* =====================================================================
   /agents
   ===================================================================== */
function mergeParts(parts) {
  var pos = [], nrm = [], part = [], limb = [];
  var nmat = new T.Matrix3(), v = new T.Vector3();
  parts.forEach(function (P) {
    var g = P.geo.index ? P.geo.toNonIndexed() : P.geo;
    var gp = g.attributes.position, gn = g.attributes.normal;
    nmat.getNormalMatrix(P.matrix);
    for (var i = 0; i < gp.count; i++) {
      v.fromBufferAttribute(gp, i).applyMatrix4(P.matrix);
      pos.push(v.x, v.y, v.z);
      v.fromBufferAttribute(gn, i).applyMatrix3(nmat).normalize();
      nrm.push(v.x, v.y, v.z);
      part.push(P.part);
      limb.push(P.limb || 0);
    }
  });
  var out = new T.BufferGeometry();
  out.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new T.Float32BufferAttribute(nrm, 3));
  out.setAttribute('aPart', new T.Float32BufferAttribute(part, 1));
  out.setAttribute('aLimb', new T.Float32BufferAttribute(limb, 1));
  return out;
}

function M4(x, y, z, rx, ry, rz) {
  return new T.Matrix4().compose(
    new T.Vector3(x, y, z),
    new T.Quaternion().setFromEuler(new T.Euler(rx || 0, ry || 0, rz || 0)),
    new T.Vector3(1, 1, 1));
}

/* limb: 0 body · 1 left leg · 2 right leg · 3 left arm · 4 right arm.
   Hips sit at y=0.66 and shoulders at y=1.32 to match the pivots the vertex
   shader swings around — move one and you must move the other. */
function makeRobotGeometry() {
  return mergeParts([
    /* head and face */
    { geo: new T.SphereGeometry(0.42, 10, 7),           matrix: M4(0, 2.02, 0),                 part: 0, limb: 0 },
    { geo: new T.BoxGeometry(0.54, 0.22, 0.16),         matrix: M4(0, 2.03, 0.36),              part: 1, limb: 0 },
    { geo: new T.CylinderGeometry(0.05, 0.05, 0.26, 4), matrix: M4(0, 2.44, 0),                 part: 0, limb: 0 },
    { geo: new T.SphereGeometry(0.085, 6, 5),           matrix: M4(0, 2.58, 0),                 part: 1, limb: 0 },
    /* torso and chest core */
    { geo: new T.CylinderGeometry(0.34, 0.40, 0.80, 8), matrix: M4(0, 1.42, 0),                 part: 0, limb: 0 },
    { geo: new T.SphereGeometry(0.14, 7, 6),            matrix: M4(0, 1.50, -0.30),             part: 1, limb: 0 },
    /* hips */
    { geo: new T.BoxGeometry(0.46, 0.22, 0.30),         matrix: M4(0, 0.74, 0),                 part: 0, limb: 0 },
    /* arms: upper arm, forearm, hand */
    { geo: new T.CylinderGeometry(0.09, 0.08, 0.46, 5), matrix: M4(-0.42, 1.12, 0),             part: 0, limb: 3 },
    { geo: new T.SphereGeometry(0.10, 6, 5),            matrix: M4(-0.42, 0.86, 0),             part: 1, limb: 3 },
    { geo: new T.CylinderGeometry(0.09, 0.08, 0.46, 5), matrix: M4(0.42, 1.12, 0),              part: 0, limb: 4 },
    { geo: new T.SphereGeometry(0.10, 6, 5),            matrix: M4(0.42, 0.86, 0),              part: 1, limb: 4 },
    /* legs: thigh, shin, foot — the foot is what makes a floor read as a floor */
    { geo: new T.CylinderGeometry(0.11, 0.09, 0.44, 6), matrix: M4(-0.15, 0.44, 0),             part: 0, limb: 1 },
    { geo: new T.BoxGeometry(0.20, 0.09, 0.34),         matrix: M4(-0.15, 0.16, 0.06),          part: 0, limb: 1 },
    { geo: new T.CylinderGeometry(0.11, 0.09, 0.44, 6), matrix: M4(0.15, 0.44, 0),              part: 0, limb: 2 },
    { geo: new T.BoxGeometry(0.20, 0.09, 0.34),         matrix: M4(0.15, 0.16, 0.06),           part: 0, limb: 2 }
  ]);
}

/* The two halves every avatar shares. Thickness, stance and foot size are
   the knobs; the joint heights are not, because SH.agentVert swings the legs
   about y=0.66 and the arms about y=1.32 as compile-time constants. */
function arms(t, span, litHands) {
  return [
    { geo: new T.CylinderGeometry(0.09 * t, 0.08 * t, 0.46, 5), matrix: M4(-span, 1.12, 0), part: 0, limb: 3 },
    { geo: new T.SphereGeometry(0.10 * t, 6, 5),                matrix: M4(-span, 0.86, 0), part: litHands ? 1 : 0, limb: 3 },
    { geo: new T.CylinderGeometry(0.09 * t, 0.08 * t, 0.46, 5), matrix: M4(span, 1.12, 0),  part: 0, limb: 4 },
    { geo: new T.SphereGeometry(0.10 * t, 6, 5),                matrix: M4(span, 0.86, 0),  part: litHands ? 1 : 0, limb: 4 }
  ];
}
function legs(t, foot) {
  return [
    { geo: new T.CylinderGeometry(0.11 * t, 0.09 * t, 0.44, 6), matrix: M4(-0.15 * t, 0.44, 0), part: 0, limb: 1 },
    { geo: new T.BoxGeometry(0.20 * t, 0.09, 0.34 * foot),      matrix: M4(-0.15 * t, 0.16, 0.06), part: 0, limb: 1 },
    { geo: new T.CylinderGeometry(0.11 * t, 0.09 * t, 0.44, 6), matrix: M4(0.15 * t, 0.44, 0),  part: 0, limb: 2 },
    { geo: new T.BoxGeometry(0.20 * t, 0.09, 0.34 * foot),      matrix: M4(0.15 * t, 0.16, 0.06),  part: 0, limb: 2 }
  ];
}
function avatarOf(key) {
  for (var i = 0; i < AVATARS.length; i++) if (AVATARS[i].key === key) return AVATARS[i];
  return AVATARS[0];
}

/* A visitor's agent is one InstancedMesh of count 1 sharing the fleet's own
   material. That sounds odd for a single body, and it is the whole trick:
   USE_INSTANCING stays defined, so the vertex-shader walk cycle and the
   per-instance tint/glow/phase/stride work unchanged. A plain Mesh here would
   have meant a second copy of the agent shader with everything as uniforms. */
function makeUserBody(key, material) {
  var A = avatarOf(key);
  var geo = mergeParts(A.build());
  var mesh = new T.InstancedMesh(geo, material, 1);
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  geo.setAttribute('aTint', new T.InstancedBufferAttribute(new Float32Array(3), 3));
  geo.setAttribute('aGlow', new T.InstancedBufferAttribute(new Float32Array(1), 1));
  geo.setAttribute('aPhase', new T.InstancedBufferAttribute(new Float32Array(1), 1));
  geo.setAttribute('aStride', new T.InstancedBufferAttribute(new Float32Array(1), 1));
  mesh.frustumCulled = false;
  return mesh;
}

function makeAgents(N, trailLen) {
  var body = makeRobotGeometry();
  var mat = new T.ShaderMaterial({ vertexShader: SH.agentVert, fragmentShader: SH.agentFrag });
  var mesh = new T.InstancedMesh(body, mat, N);
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  body.setAttribute('aTint', new T.InstancedBufferAttribute(new Float32Array(N * 3), 3));
  body.setAttribute('aGlow', new T.InstancedBufferAttribute(new Float32Array(N), 1));
  body.setAttribute('aPhase', new T.InstancedBufferAttribute(new Float32Array(N), 1));
  body.setAttribute('aStride', new T.InstancedBufferAttribute(new Float32Array(N), 1));
  mesh.frustumCulled = false;

  function pts(count) {
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(count * 3), 3));
    g.setAttribute('aSize', new T.BufferAttribute(new Float32Array(count), 1));
    g.setAttribute('aCol', new T.BufferAttribute(new Float32Array(count * 3), 3));
    g.setAttribute('aFade', new T.BufferAttribute(new Float32Array(count), 1));
    var m = new T.Points(g, new T.ShaderMaterial({
      vertexShader: SH.pointVert, fragmentShader: SH.pointFrag,
      transparent: true, blending: T.AdditiveBlending, depthWrite: false
    }));
    m.frustumCulled = false;
    return m;
  }
  return { mesh: mesh, heads: pts(N), trails: pts(N * trailLen), trailLen: trailLen, cursor: 0 };
}

/* =====================================================================
   /city
   ===================================================================== */
function buildRoutes() {
  var routes = [];
  for (var i = 1; i < DISTRICTS.length; i++) {
    routes.push([DISTRICTS[0], DISTRICTS[i]]);
    routes.push([DISTRICTS[i], DISTRICTS[i === DISTRICTS.length - 1 ? 1 : i + 1]]);
  }
  return routes.map(function (pair, idx) {
    var a = pair[0], b = pair[1];
    var mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
    var lift = 3 + Math.hypot(b.x - a.x, b.z - a.z) * 0.05;
    var out = 1 + (idx % 2) * 0.18;
    return {
      a: a, b: b, col: new T.Color(a.col).lerp(new T.Color(b.col), 0.5),
      curve: new T.QuadraticBezierCurve3(
        new T.Vector3(a.x, 1.2, a.z), new T.Vector3(mx * out, lift, mz * out), new T.Vector3(b.x, 1.2, b.z))
    };
  });
}

function makeFlows(routes) {
  var SEG = 70, verts = [], ts = [], cols = [], rids = [];
  routes.forEach(function (R, ri) {
    var pts = R.curve.getPoints(SEG);
    for (var i = 0; i < SEG; i++) {
      var p0 = pts[i], p1 = pts[i + 1];
      verts.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);
      ts.push(i / SEG, (i + 1) / SEG);
      cols.push(R.col.r, R.col.g, R.col.b, R.col.r, R.col.g, R.col.b);
      rids.push(ri, ri);
    }
  });
  var g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(new Float32Array(verts), 3));
  g.setAttribute('aT', new T.BufferAttribute(new Float32Array(ts), 1));
  g.setAttribute('aCol', new T.BufferAttribute(new Float32Array(cols), 3));
  g.setAttribute('aRoute', new T.BufferAttribute(new Float32Array(rids), 1));
  var mesh = new T.LineSegments(g, new T.ShaderMaterial({
    vertexShader: SH.flowVert, fragmentShader: SH.flowFrag,
    uniforms: { uTime: { value: 0 } },
    transparent: true, blending: T.AdditiveBlending, depthWrite: false
  }));
  mesh.frustumCulled = false;
  return mesh;
}

function makeLandmarks(scene) {
  var out = [];
  DISTRICTS.forEach(function (D) {
    var g = new T.Group();
    g.position.set(D.x, 0, D.z);
    var col = new T.Color(D.col);
    var glow = new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.85, toneMapped: false });
    var faint = new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.16, toneMapped: false,
      side: T.DoubleSide, depthWrite: false });
    var disc = new T.Mesh(new T.RingGeometry(D.r * 0.94, D.r, 72), faint);
    disc.rotation.x = -Math.PI / 2; disc.position.y = 0.05; g.add(disc);

    if (D.kind === 'core') {
      var pillar = new T.Mesh(new T.CylinderGeometry(4.5, 6.5, 46, 8), glow);
      pillar.position.y = 23; g.add(pillar);
      var ico = new T.Mesh(new T.IcosahedronGeometry(9, 1),
        new T.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.9, toneMapped: false }));
      ico.position.y = 58; g.add(ico);
      for (var r = 0; r < 3; r++) {
        var ring = new T.Mesh(new T.TorusGeometry(14 + r * 5, 0.32, 6, 72), glow);
        ring.position.y = 58; ring.rotation.x = Math.PI / 2 + r * 0.4; g.add(ring);
        ring.userData.spin = 0.22 - r * 0.06;
      }
      var beam = new T.Mesh(new T.CylinderGeometry(1.1, 1.1, 260, 6), faint);
      beam.position.y = 130; g.add(beam);
      g.userData.core = ico;
    } else if (D.kind === 'tower') {
      var t1 = new T.Mesh(new T.CylinderGeometry(3.2, 5.2, 74, 6), glow); t1.position.y = 37; g.add(t1);
      for (var s = 0; s < 4; s++) {
        var fin = new T.Mesh(new T.TorusGeometry(7 - s * 1.1, 0.26, 5, 40), glow);
        fin.position.y = 24 + s * 15; fin.rotation.x = Math.PI / 2; g.add(fin);
      }
    } else if (D.kind === 'hub') {
      var dome = new T.Mesh(new T.SphereGeometry(13, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        new T.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.55, toneMapped: false }));
      dome.position.y = 1; g.add(dome);
      var spike = new T.Mesh(new T.ConeGeometry(1.6, 30, 6), glow); spike.position.y = 26; g.add(spike);
    } else if (D.kind === 'lab') {
      var flask = new T.Mesh(new T.ConeGeometry(10, 26, 5), faint); flask.position.y = 13; g.add(flask);
      var orbG = new T.Group(); orbG.position.y = 34; g.add(orbG);
      for (var o = 0; o < 3; o++) {
        var orb = new T.Mesh(new T.SphereGeometry(1.5, 10, 8), glow);
        orb.position.set(Math.cos(o * 2.1) * 9, Math.sin(o * 1.3) * 3, Math.sin(o * 2.1) * 9);
        orbG.add(orb);
      }
      g.userData.spinGroup = orbG;
    } else if (D.kind === 'plaza') {
      for (var k2 = 0; k2 < 6; k2++) {
        var col2 = new T.Mesh(new T.CylinderGeometry(1.1, 1.1, 20, 6), glow);
        col2.position.set(Math.cos(k2 / 6 * 6.283) * 11, 10, Math.sin(k2 / 6 * 6.283) * 11);
        g.add(col2);
      }
      var cap = new T.Mesh(new T.TorusGeometry(11, 0.5, 6, 48), glow);
      cap.position.y = 21; cap.rotation.x = Math.PI / 2; g.add(cap);
    } else {
      for (var c3 = 0; c3 < 4; c3++) {
        var stack = new T.Mesh(new T.CylinderGeometry(2, 2.6, 30 + c3 * 6, 6), glow);
        stack.position.set(-9 + c3 * 6, (30 + c3 * 6) / 2, 0); g.add(stack);
      }
    }
    scene.add(g);
    out.push(g);
  });
  return out;
}

function makeSiteMarkers(sites) {
  var n = sites.length;
  var doors = new T.InstancedMesh(new T.PlaneGeometry(1, 1),
    new T.MeshBasicMaterial({ transparent: true, opacity: 0.9, side: T.DoubleSide,
      depthWrite: false, blending: T.AdditiveBlending, toneMapped: false }), n);
  doors.instanceMatrix.setUsage(T.DynamicDrawUsage);
  var rings = new T.InstancedMesh(new T.RingGeometry(2.6, 3.3, 32),
    new T.MeshBasicMaterial({ transparent: true, opacity: 0.85, side: T.DoubleSide,
      depthWrite: false, blending: T.AdditiveBlending, toneMapped: false }), n);
  rings.instanceMatrix.setUsage(T.DynamicDrawUsage);
  var c = new T.Color();
  for (var i = 0; i < n; i++) { c.set(sites[i].col); doors.setColorAt(i, c); rings.setColorAt(i, c); }
  doors.frustumCulled = false; rings.frustumCulled = false;
  return { doors: doors, rings: rings };
}

/* The inside of EVERY building: a slab per storey, desks in proportion to the
   floorplate, and a lift shaft with a car riding it.

   Furniture is sized to the building rather than fixed, because three desks in
   a 5x5 outskirt shed and three in a 14x14 tower is what made the old city read
   as scenery — the shed looked crowded and the tower looked abandoned.

   Four instanced meshes cover the whole city. Nothing here is drawn unless its
   building is cut open, so the cost of a closed city is vertex work on geometry
   the fragment shader discards. */
function makeInterior(boxes) {
  var slabs = [], desks = [], shafts = [], cars = [];
  boxes.forEach(function (b, bi) {
    var r = Math.max(b.w, b.d) * 0.5;
    /* One desk per ~26 square units of floorplate, so density is constant and
       the count is not. Capped both ends: never an empty storey, never a
       warehouse of furniture in a landmark. */
    var perFloor = Math.max(1, Math.min(5, Math.round((b.w * b.d) / 26)));
    if (MOBILE) perFloor = Math.max(1, perFloor - 1);
    for (var f = 0; f < b.floors; f++) {
      var y = FLOOR_Y0 + f * FLOOR_H;
      slabs.push({ box: bi, x: b.x, y: y, z: b.z, w: b.w * 0.88, d: b.d * 0.88, col: b.tint });
      for (var k = 0; k < perFloor; k++) {
        var a = (k / perFloor) * Math.PI * 2 + f * 0.9 + bi;
        desks.push({ box: bi, x: b.x + Math.cos(a) * r * 0.52, y: y + 0.44,
                     z: b.z + Math.sin(a) * r * 0.52, rot: -a, col: b.tint });
      }
    }
    /* The lift core sits dead centre, which is also the one place it cannot
       collide with anything: agents walk a circuit between 0.30r and 0.66r and
       the desks sit at 0.52r, so the shaft has the middle to itself. */
    var span = (b.floors - 1) * FLOOR_H;
    shafts.push({ box: bi, x: b.x, y: FLOOR_Y0 + span * 0.5, z: b.z,
                  w: Math.min(1.5, b.w * 0.22), h: Math.max(FLOOR_H, span + 1.3),
                  d: Math.min(1.5, b.d * 0.22), col: b.tint });
    cars.push({ box: bi, x: b.x, z: b.z, base: FLOOR_Y0 + 0.55, span: span,
                w: Math.min(1.05, b.w * 0.16), d: Math.min(1.05, b.d * 0.16),
                phase: b.seed, col: b.tint });
  });

  function build(list, geo, sizer, dynamic) {
    var mat = new T.ShaderMaterial({
      vertexShader: SH.interiorVert, fragmentShader: SH.interiorFrag,
      transparent: true, depthWrite: false, side: T.DoubleSide
    });
    var mesh = new T.InstancedMesh(geo, mat, list.length);
    mesh.instanceMatrix.setUsage(dynamic ? T.DynamicDrawUsage : T.StaticDrawUsage);
    var aOpen = new Float32Array(list.length);
    var aTint = new Float32Array(list.length * 3);
    var m = new T.Matrix4(), q = new T.Quaternion(), p = new T.Vector3(), sc = new T.Vector3();
    var c = new T.Color();
    list.forEach(function (it, i) {
      sizer(it, p, sc, q);
      m.compose(p, q, sc);
      mesh.setMatrixAt(i, m);
      c.set(it.col);
      aTint[i * 3] = c.r; aTint[i * 3 + 1] = c.g; aTint[i * 3 + 2] = c.b;
    });
    geo.setAttribute('aOpen', new T.InstancedBufferAttribute(aOpen, 1));
    geo.setAttribute('aTint', new T.InstancedBufferAttribute(aTint, 3));
    mesh.frustumCulled = false;
    mesh.userData.aOpen = geo.attributes.aOpen;
    mesh.userData.list = list;
    return mesh;
  }

  var _e2 = new T.Euler();
  var floorMesh = build(slabs, new T.BoxGeometry(1, 1, 1), function (it, p, sc, q) {
    p.set(it.x, it.y, it.z); sc.set(it.w, 0.16, it.d); q.identity();
  });
  var deskMesh = build(desks, new T.BoxGeometry(1, 1, 1), function (it, p, sc, q) {
    p.set(it.x, it.y, it.z); sc.set(1.5, 0.5, 0.9);
    _e2.set(0, it.rot, 0); q.setFromEuler(_e2);
  });
  var shaftMesh = build(shafts, new T.BoxGeometry(1, 1, 1), function (it, p, sc, q) {
    p.set(it.x, it.y, it.z); sc.set(it.w, it.h, it.d); q.identity();
  });
  /* The only interior piece that moves, so the only one on a dynamic buffer. */
  var carMesh = build(cars, new T.BoxGeometry(1, 1, 1), function (it, p, sc, q) {
    p.set(it.x, it.base, it.z); sc.set(it.w, 1.3, it.d); q.identity();
  }, true);
  return { floors: floorMesh, desks: deskMesh, shafts: shaftMesh, cars: carMesh };
}

function makeMotes(rnd, count) {
  var g = new T.BufferGeometry();
  var pos = new Float32Array(count * 3), size = new Float32Array(count);
  var col = new Float32Array(count * 3), fade = new Float32Array(count);
  var c = new T.Color();
  var hues = [0x38d6ff, 0xa878ff, 0x3ddc97, 0x7ee0ff];
  for (var i = 0; i < count; i++) {
    var a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 380;
    pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = rnd() * 90; pos[i * 3 + 2] = Math.sin(a) * r;
    size[i] = 0.7 + rnd() * 1.9;
    fade[i] = 0.14 + rnd() * 0.4;
    c.set(hues[(rnd() * hues.length) | 0]);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new T.BufferAttribute(size, 1));
  g.setAttribute('aCol', new T.BufferAttribute(col, 3));
  g.setAttribute('aFade', new T.BufferAttribute(fade, 1));
  var m = new T.Points(g, new T.ShaderMaterial({
    vertexShader: SH.pointVert, fragmentShader: SH.pointFrag,
    transparent: true, blending: T.AdditiveBlending, depthWrite: false
  }));
  m.frustumCulled = false;
  return m;
}

/* Two silhouettes, because a park of one tree repeated is a texture, not a
   park. Everything else about a tree — height, girth, spread, lean of the
   canopy, shade of green — is per-instance, so this is two draw calls for
   the whole city's greenery. `part: 1` marks canopy for the shader. */
function treeGeometry(kind) {
  if (kind) return mergeParts([
    { geo: new T.CylinderGeometry(0.13, 0.22, 1.30, 5), matrix: M4(0, 0.65, 0),  part: 0 },
    { geo: new T.ConeGeometry(1.28, 1.95, 6),           matrix: M4(0, 1.95, 0),  part: 1 },
    { geo: new T.ConeGeometry(0.94, 1.70, 6),           matrix: M4(0, 2.92, 0),  part: 1 },
    { geo: new T.ConeGeometry(0.56, 1.42, 6),           matrix: M4(0, 3.78, 0),  part: 1 }
  ]);
  return mergeParts([
    { geo: new T.CylinderGeometry(0.16, 0.27, 1.70, 5), matrix: M4(0, 0.85, 0),  part: 0 },
    { geo: new T.IcosahedronGeometry(1.24, 0),          matrix: M4(0, 2.42, 0),  part: 1 },
    { geo: new T.IcosahedronGeometry(0.84, 0),          matrix: M4(0.46, 3.12, -0.24), part: 1 }
  ]);
}

function makeFoliage(trees, parks) {
  var mat = new T.ShaderMaterial({
    vertexShader: SH.treeVert, fragmentShader: SH.treeFrag,
    uniforms: { uTime: { value: 0 }, uFog: { value: new T.Color(0x050a15) }, uFogK: { value: 0.0031 } }
  });
  var GREENS = [0x1f7a5c, 0x25855a, 0x1a6f66, 0x2d8a4f, 0x186a58];
  var meshes = [];
  var m = new T.Matrix4(), q = new T.Quaternion(), pv = new T.Vector3(), sv = new T.Vector3();
  var eu = new T.Euler(), c = new T.Color();

  function fill(list, geo, tintOf, spreadOf) {
    var n = list.length;
    if (!n) return;
    var mesh = new T.InstancedMesh(geo, mat, n);
    mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
    var aSpread = new Float32Array(n), aSeed = new Float32Array(n), aTint = new Float32Array(n * 3);
    list.forEach(function (it, i) {
      eu.set(0, it.rot || 0, 0); q.setFromEuler(eu);
      pv.set(it.x, it.y || 0, it.z);
      sv.set(it.s, it.s, it.s);
      m.compose(pv, q, sv);
      mesh.setMatrixAt(i, m);
      aSpread[i] = spreadOf(it);
      aSeed[i] = it.seed || 0;
      c.setHex(tintOf(it));
      aTint[i * 3] = c.r; aTint[i * 3 + 1] = c.g; aTint[i * 3 + 2] = c.b;
    });
    geo.setAttribute('aSpread', new T.InstancedBufferAttribute(aSpread, 1));
    geo.setAttribute('aSeed', new T.InstancedBufferAttribute(aSeed, 1));
    geo.setAttribute('aTint', new T.InstancedBufferAttribute(aTint, 3));
    mesh.frustumCulled = false;
    meshes.push(mesh);
  }

  [0, 1].forEach(function (kind) {
    fill(trees.filter(function (t) { return t.kind === kind; }), treeGeometry(kind),
      function (t) { return GREENS[(t.seed * GREENS.length) | 0]; },
      function (t) { return t.spread; });
  });
  /* The lawn under a park. Trunk-dark by design — it has to read as ground
     the grid stops at, not as another lit surface. */
  fill(parks.map(function (P) {
      return { x: P.x, y: 0.05, z: P.z, s: P.r, rot: 0, seed: 0 };
    }),
    mergeParts([{ geo: new T.CircleGeometry(1, 26), matrix: M4(0, 0, 0, -Math.PI / 2, 0, 0), part: 0 }]),
    function () { return 0x18513c; }, function () { return 1; });

  return { meshes: meshes, material: mat };
}

/* Signals at the junctions.
   The two axes run out of phase with each other, because a city where every
   light is green at once is a city with no lights in it. One post per junction
   rather than four: at this scale the second one is pixels, and the cycle is
   what reads, not the hardware. */
/* EVERY BUILDING GETS AN ENTRANCE AND SOMEBODY ON IT.
   A city of six hundred sealed boxes has no way in; a lit canopy, a scanner
   arch and a sentry is the difference between a block and a building somebody
   works in. All three are instanced off the shared door direction, so the gate
   is always on the side the agents actually arrive at. */
function gateGeometry() {
  return mergeParts([
    { geo: new T.BoxGeometry(3.7, 0.24, 1.7), matrix: M4(0, 3.55, 0.75), part: 0 },
    { geo: new T.BoxGeometry(0.26, 3.6, 0.26), matrix: M4(-1.68, 1.8, 1.32), part: 0 },
    { geo: new T.BoxGeometry(0.26, 3.6, 0.26), matrix: M4(1.68, 1.8, 1.32), part: 0 },
    { geo: new T.BoxGeometry(0.2, 2.7, 0.44), matrix: M4(-1.5, 1.35, 0.3), part: 0 },
    { geo: new T.BoxGeometry(0.2, 2.7, 0.44), matrix: M4(1.5, 1.35, 0.3), part: 0 },
    { geo: new T.BoxGeometry(3.2, 0.16, 0.44), matrix: M4(0, 2.62, 0.3), part: 0 }
  ]);
}

/* A sentry, not an agent: no limb tags, so the shared agent shader leaves it
   standing still. Same material as the fleet, so it is lit identically for
   nothing — a second material here would be a second thing to keep in step. */
function guardGeometry() {
  return mergeParts([
    { geo: new T.SphereGeometry(0.34, 8, 6), matrix: M4(0, 1.96, 0), part: 0 },
    { geo: new T.BoxGeometry(0.46, 0.16, 0.14), matrix: M4(0, 1.97, 0.3), part: 1 },
    { geo: new T.CylinderGeometry(0.3, 0.37, 0.78, 7), matrix: M4(0, 1.36, 0), part: 0 },
    { geo: new T.SphereGeometry(0.1, 6, 5), matrix: M4(0, 1.5, 0.3), part: 1 },
    { geo: new T.BoxGeometry(0.62, 0.16, 0.34), matrix: M4(0, 1.72, 0), part: 0 },
    { geo: new T.CylinderGeometry(0.08, 0.07, 0.62, 5), matrix: M4(-0.36, 1.1, 0), part: 0 },
    { geo: new T.CylinderGeometry(0.08, 0.07, 0.62, 5), matrix: M4(0.36, 1.1, 0), part: 0 },
    { geo: new T.BoxGeometry(0.44, 0.2, 0.3), matrix: M4(0, 0.72, 0), part: 0 },
    { geo: new T.CylinderGeometry(0.13, 0.11, 0.66, 6), matrix: M4(-0.14, 0.33, 0), part: 0 },
    { geo: new T.CylinderGeometry(0.13, 0.11, 0.66, 6), matrix: M4(0.14, 0.33, 0), part: 0 }
  ]);
}

function makeEntrances(boxes, agentMaterial) {
  var n = boxes.length;
  var frame = new T.InstancedMesh(gateGeometry(),
    new T.MeshBasicMaterial({ color: 0x16273d, toneMapped: false }), n);
  var lamp = new T.InstancedMesh(new T.BoxGeometry(3.3, 0.07, 0.5),
    new T.MeshBasicMaterial({ transparent: true, opacity: 0.9, toneMapped: false,
      blending: T.AdditiveBlending, depthWrite: false }), n);
  var guards = new T.InstancedMesh(guardGeometry(), agentMaterial, n);
  var gg = guards.geometry;
  var tint = new Float32Array(n * 3), glow = new Float32Array(n),
      phase = new Float32Array(n), stride = new Float32Array(n);
  var m = new T.Matrix4(), q = new T.Quaternion(), pv = new T.Vector3(),
      sv = new T.Vector3(1, 1, 1), eu = new T.Euler(), c = new T.Color();
  var d3 = [0, 0, 0];
  boxes.forEach(function (b, i) {
    doorPoint(b.x, b.z, b.w, b.d, d3, 0);
    eu.set(0, d3[2], 0); q.setFromEuler(eu);
    pv.set(d3[0], 0, d3[1]);
    m.compose(pv, q, sv);
    frame.setMatrixAt(i, m);
    /* The threshold strip is the district's own colour, so a lit doorway says
       which district you are standing in before you read a single label. */
    c.set(b.tint);
    lamp.setColorAt(i, c);
    pv.set(d3[0] + Math.sin(d3[2] + 1.5708) * 2.15, 0.05, d3[1] + Math.cos(d3[2] + 1.5708) * 2.15);
    m.compose(pv, q, sv);
    lamp.setMatrixAt(i, m);
    /* The sentry stands to one side of the doorway, facing out. */
    pv.set(d3[0] + Math.sin(d3[2]) * 1.15 + Math.sin(d3[2] + 1.5708) * 1.85, 0,
           d3[1] + Math.cos(d3[2]) * 1.15 + Math.cos(d3[2] + 1.5708) * 1.85);
    m.compose(pv, q, sv);
    guards.setMatrixAt(i, m);
    /* Steel, deliberately: the six cool hues are state colours and warm orange
       belongs to the visitor. Security is infrastructure, not a mood. */
    tint[i * 3] = 0.62; tint[i * 3 + 1] = 0.71; tint[i * 3 + 2] = 0.82;
  });
  gg.setAttribute('aTint', new T.InstancedBufferAttribute(tint, 3));
  gg.setAttribute('aGlow', new T.InstancedBufferAttribute(glow, 1));
  gg.setAttribute('aPhase', new T.InstancedBufferAttribute(phase, 1));
  gg.setAttribute('aStride', new T.InstancedBufferAttribute(stride, 1));
  frame.frustumCulled = false; lamp.frustumCulled = false; guards.frustumCulled = false;
  return { frame: frame, lamp: lamp, guards: guards };
}

function makeSignals() {
  var spots = [], reach = MOBILE ? 4 : 6;
  for (var i = -reach; i <= reach; i++) {
    for (var j = -reach; j <= reach; j++) {
      spots.push({ x: i * STREET + LANE * 0.5 + 1.0, z: j * STREET + LANE * 0.5 + 1.0,
                   parity: (i + j) & 1 });
    }
  }
  var frame = new T.InstancedMesh(mergeParts([
    { geo: new T.CylinderGeometry(0.12, 0.17, 5.4, 6), matrix: M4(0, 2.7, 0), part: 0 },
    { geo: new T.BoxGeometry(0.44, 1.5, 0.44),         matrix: M4(0, 6.15, 0), part: 0 }
  ]), new T.MeshBasicMaterial({ color: 0x16273d, toneMapped: false }), spots.length);
  var lamps = new T.InstancedMesh(new T.SphereGeometry(0.155, 7, 6),
    new T.MeshBasicMaterial({ toneMapped: false }), spots.length * 3);
  var m = new T.Matrix4(), q = new T.Quaternion(), pv = new T.Vector3(), sv = new T.Vector3(1, 1, 1);
  spots.forEach(function (S, i) {
    pv.set(S.x, 0, S.z);
    m.compose(pv, q, sv);
    frame.setMatrixAt(i, m);
    for (var k = 0; k < 3; k++) {
      pv.set(S.x - 0.24, 6.62 - k * 0.45, S.z - 0.24);
      m.compose(pv, q, sv);
      lamps.setMatrixAt(i * 3 + k, m);
    }
  });
  frame.frustumCulled = false; lamps.frustumCulled = false;
  return { frame: frame, lamps: lamps, spots: spots };
}

function makeWater(ponds) {
  var geo = new T.CircleGeometry(1, 34);
  geo.rotateX(-Math.PI / 2);
  var mesh = new T.InstancedMesh(geo, new T.ShaderMaterial({
    vertexShader: SH.waterVert, fragmentShader: SH.waterFrag,
    uniforms: { uTime: { value: 0 }, uFog: { value: new T.Color(0x050a15) }, uFogK: { value: 0.0031 } }
  }), Math.max(1, ponds.length));
  var m = new T.Matrix4(), q = new T.Quaternion(), pv = new T.Vector3(), sv = new T.Vector3();
  ponds.forEach(function (P, i) {
    pv.set(P.x, 0.07, P.z); sv.set(P.r, 1, P.r);
    m.compose(pv, q, sv);
    mesh.setMatrixAt(i, m);
  });
  mesh.count = ponds.length;
  mesh.frustumCulled = false;
  return mesh;
}

/* Flying cars. The ground vehicles ride the district routes; these ride SKY
   LANES — three rings at three altitudes, which is what stops them reading as
   drones with a different shape. They bank into the turn, because a vehicle
   that corners flat looks like it is being dragged. */
/* An open-topped pod, because the rider has to be visible SITTING in it. The
   first version put a full-canopy car under an agent standing at full height:
   the body floated a third of a unit above the roof and read as a bug, which is
   exactly what it was. */
function rideGeometry() {
  return mergeParts([
    { geo: new T.BoxGeometry(4.4, 0.34, 1.9),  matrix: M4(0, 0, 0),          part: 0 },
    { geo: new T.BoxGeometry(4.2, 0.62, 0.18), matrix: M4(0, 0.36, 0.86),    part: 0 },
    { geo: new T.BoxGeometry(4.2, 0.62, 0.18), matrix: M4(0, 0.36, -0.86),   part: 0 },
    { geo: new T.BoxGeometry(0.9, 0.5, 1.5),   matrix: M4(-2.3, 0.24, 0),    part: 0 },
    { geo: new T.BoxGeometry(0.7, 0.26, 0.5),  matrix: M4(2.5, 0.05, 0),     part: 1 },
    { geo: new T.BoxGeometry(0.5, 0.3, 0.44),  matrix: M4(-2.7, 0.05, 0.6),  part: 1 },
    { geo: new T.BoxGeometry(0.5, 0.3, 0.44),  matrix: M4(-2.7, 0.05, -0.6), part: 1 }
  ]);
}

function flyerGeometry() {
  return mergeParts([
    { geo: new T.BoxGeometry(3.4, 0.5, 1.25),  matrix: M4(0, 0, 0), part: 0 },
    { geo: new T.BoxGeometry(1.5, 0.42, 1.0),  matrix: M4(-0.2, 0.42, 0), part: 0 },
    { geo: new T.BoxGeometry(0.5, 0.22, 0.36), matrix: M4(1.8, 0.02, 0), part: 1 },
    { geo: new T.BoxGeometry(0.36, 0.2, 0.3),  matrix: M4(-1.75, 0.02, 0.42), part: 1 },
    { geo: new T.BoxGeometry(0.36, 0.2, 0.3),  matrix: M4(-1.75, 0.02, -0.42), part: 1 }
  ]);
}

/* The taxis an agent actually rides. One per agent slot, collapsed to nothing
   for everybody currently on foot — the same trick the fleet already uses for
   dead user slots, and cheaper in code than keeping a live pool in sync. */
function makeRides(N) {
  var mesh = new T.InstancedMesh(rideGeometry(),
    new T.MeshBasicMaterial({ color: new T.Color(0x9fe6ff), toneMapped: false }), N);
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  mesh.frustumCulled = false;
  return mesh;
}

function makeFlyers(rnd, count) {
  var body = flyerGeometry();
  var mesh = new T.InstancedMesh(body, new T.MeshBasicMaterial({ toneMapped: false }), count);
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  mesh.frustumCulled = false;
  var c = new T.Color(), state = [];
  var HUES = [0x38d6ff, 0xff6bd6, 0xffc663, 0x7ee0ff, 0xa878ff];
  var LANES = [{ y: 30, r: 120 }, { y: 46, r: 190 }, { y: 64, r: 260 }];
  for (var i = 0; i < count; i++) {
    var L = LANES[i % LANES.length];
    c.setHex(HUES[(rnd() * HUES.length) | 0]);
    mesh.setColorAt(i, c);
    state.push({
      r: L.r + (rnd() - 0.5) * 46,
      y: L.y + (rnd() - 0.5) * 9,
      a: rnd() * 6.283,
      sp: (i % 2 ? 1 : -1) * (0.10 + rnd() * 0.09),
      squash: 0.72 + rnd() * 0.4,
      bob: rnd() * 6.283
    });
  }
  return { mesh: mesh, state: state };
}

function makeTraffic(rnd, routes) {
  var dn = CFG.drones, vn = CFG.vehicles;
  var drones = new T.InstancedMesh(new T.OctahedronGeometry(0.85, 0),
    new T.MeshBasicMaterial({ toneMapped: false }), dn);
  drones.instanceMatrix.setUsage(T.DynamicDrawUsage);
  var vehicles = new T.InstancedMesh(new T.BoxGeometry(2.4, 0.5, 1.0),
    new T.MeshBasicMaterial({ toneMapped: false }), vn);
  vehicles.instanceMatrix.setUsage(T.DynamicDrawUsage);
  drones.frustumCulled = false; vehicles.frustumCulled = false;
  var c = new T.Color(), dstate = [], vstate = [];
  for (var i = 0; i < dn; i++) {
    c.setHex(0x7ee0ff).multiplyScalar(0.9); drones.setColorAt(i, c);
    dstate.push({ r: 70 + rnd() * 300, a: rnd() * 6.283, y: 34 + rnd() * 52,
      sp: (rnd() < 0.5 ? -1 : 1) * (0.05 + rnd() * 0.1), bob: rnd() * 6.283 });
  }
  for (var v = 0; v < vn; v++) {
    c.setHex(rnd() < 0.5 ? 0x38d6ff : 0xff8fb0); vehicles.setColorAt(v, c);
    vstate.push({ route: (rnd() * routes.length) | 0, t: rnd(), sp: (0.035 + rnd() * 0.05) * (rnd() < 0.5 ? -1 : 1) });
  }
  return { drones: drones, vehicles: vehicles, dstate: dstate, vstate: vstate };
}

/* =====================================================================
   /effects
   ===================================================================== */
function makeBloom(renderer, w, h) {
  var type = renderer.capabilities.isWebGL2 ? T.HalfFloatType : T.UnsignedByteType;
  function rt(sw, sh) {
    return new T.WebGLRenderTarget(Math.max(2, sw | 0), Math.max(2, sh | 0), {
      minFilter: T.LinearFilter, magFilter: T.LinearFilter,
      format: T.RGBAFormat, type: type, depthBuffer: false, stencilBuffer: false
    });
  }
  var scene = new T.Scene();
  var cam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var quad = new T.Mesh(new T.PlaneGeometry(2, 2), null);
  quad.frustumCulled = false;
  scene.add(quad);
  var main = new T.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
    minFilter: T.LinearFilter, magFilter: T.LinearFilter,
    format: T.RGBAFormat, type: type, depthBuffer: true, stencilBuffer: false
  });
  var a1 = rt(w / 2, h / 2), a2 = rt(w / 2, h / 2), b1 = rt(w / 4, h / 4), b2 = rt(w / 4, h / 4);
  var bright = new T.ShaderMaterial({ vertexShader: SH.quadVert, fragmentShader: SH.brightFrag,
    uniforms: { tSrc: { value: null }, uThresh: { value: 0.42 }, uKnee: { value: 0.55 } } });
  var blur = new T.ShaderMaterial({ vertexShader: SH.quadVert, fragmentShader: SH.blurFrag,
    uniforms: { tSrc: { value: null }, uDir: { value: new T.Vector2() } } });
  var comp = new T.ShaderMaterial({ vertexShader: SH.quadVert, fragmentShader: SH.compositeFrag,
    uniforms: { tSrc: { value: null }, tBloomA: { value: null }, tBloomB: { value: null },
                uStrength: { value: 1.05 }, uTime: { value: 0 } } });
  function pass(mat, target) {
    quad.material = mat;
    renderer.setRenderTarget(target || null);
    renderer.clear();
    renderer.render(scene, cam);
  }
  return {
    main: main,
    setSize: function (nw, nh) {
      main.setSize(nw, nh);
      a1.setSize(nw / 2, nh / 2); a2.setSize(nw / 2, nh / 2);
      b1.setSize(nw / 4, nh / 4); b2.setSize(nw / 4, nh / 4);
    },
    render: function (time, strength) {
      bright.uniforms.tSrc.value = main.texture; pass(bright, a1);
      blur.uniforms.tSrc.value = a1.texture; blur.uniforms.uDir.value.set(1 / a1.width, 0); pass(blur, a2);
      blur.uniforms.tSrc.value = a2.texture; blur.uniforms.uDir.value.set(0, 1 / a1.height); pass(blur, a1);
      blur.uniforms.tSrc.value = a1.texture; blur.uniforms.uDir.value.set(1.6 / b1.width, 0); pass(blur, b1);
      blur.uniforms.tSrc.value = b1.texture; blur.uniforms.uDir.value.set(0, 1.6 / b1.height); pass(blur, b2);
      comp.uniforms.tSrc.value = main.texture;
      comp.uniforms.tBloomA.value = a1.texture;
      comp.uniforms.tBloomB.value = b2.texture;
      comp.uniforms.uStrength.value = strength;
      comp.uniforms.uTime.value = time;
      pass(comp, null);
    }
  };
}

/* =====================================================================
   /scene — camera rig.
   Pointer events are unified so a finger and a mouse take the same path:
   one contact orbits, two contacts pinch to zoom and drag to pan. Every
   one of those also has a button in the dock, because a gesture nobody
   knows about is not a control.
   ===================================================================== */
function CameraRig(camera, dom) {
  var self = this;
  this.target = new T.Vector3(0, 6, 0);
  this.wish = new T.Vector3(0, 6, 0);
  this.sph = { theta: -0.9, phi: 0.58, radius: 340 };
  this.wishSph = { theta: -0.9, phi: 0.58, radius: 340 };
  this.mode = 'god';
  this.followIndex = -1;
  this.spin = 0;                 /* held rotate buttons */
  this.autoSpin = false;

  var MINR = 18, MAXR = 700;
  var pts = new Map();
  var last1 = null, lastDist = 0, lastMid = null;

  function midOf(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function distOf(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function down(e) {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) last1 = { x: e.clientX, y: e.clientY };
    if (pts.size === 2) {
      var v = Array.from(pts.values());
      lastDist = distOf(v[0], v[1]);
      lastMid = midOf(v[0], v[1]);
    }
    dom.setPointerCapture && dom.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var v = Array.from(pts.values());

    if (pts.size === 1) {
      /* Right button or shift still pans on a mouse, for people who expect it. */
      var dx = e.clientX - last1.x, dy = e.clientY - last1.y;
      last1 = { x: e.clientX, y: e.clientY };
      if (e.buttons === 2 || e.shiftKey) self.pan(dx, dy);
      else self.orbit(-dx * 0.0042, -dy * 0.0035);
    } else if (pts.size === 2) {
      var d = distOf(v[0], v[1]), mid = midOf(v[0], v[1]);
      if (lastDist > 0) self.zoomBy(lastDist / d);
      self.pan(mid.x - lastMid.x, mid.y - lastMid.y);
      lastDist = d; lastMid = mid;
    }
  }
  function up(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) { lastDist = 0; lastMid = null; }
    if (pts.size === 1) { var v = Array.from(pts.values()); last1 = { x: v[0].x, y: v[0].y }; }
    dom.releasePointerCapture && dom.releasePointerCapture(e.pointerId);
  }
  function wheel(e) { e.preventDefault(); self.zoomBy(1 + Math.sign(e.deltaY) * 0.11); }

  dom.addEventListener('pointerdown', down);
  dom.addEventListener('pointermove', move);
  dom.addEventListener('pointerup', up);
  dom.addEventListener('pointercancel', up);
  dom.addEventListener('pointerleave', up);
  dom.addEventListener('wheel', wheel, { passive: false });
  dom.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  this.orbit = function (dTheta, dPhi) {
    this.autoSpin = false;
    this.wishSph.theta += dTheta;
    this.wishSph.phi = Math.max(0.12, Math.min(1.45, this.wishSph.phi + dPhi));
  };
  this.zoomBy = function (k) {
    this.wishSph.radius = Math.max(MINR, Math.min(MAXR, this.wishSph.radius * k));
  };
  this.pan = function (dx, dy) {
    var f = this.wishSph.radius * 0.0016;
    var ct = Math.cos(this.wishSph.theta), st = Math.sin(this.wishSph.theta);
    this.wish.x -= (dx * ct - dy * st) * f;
    this.wish.z -= (dx * st + dy * ct) * f;
    this.mode = 'god'; this.followIndex = -1; this.autoSpin = false;
  };
  this.god = function () {
    this.mode = 'god'; this.followIndex = -1; this.autoSpin = false;
    this.wish.set(0, 6, 0);
    this.wishSph.theta = -0.9; this.wishSph.phi = 0.58; this.wishSph.radius = 340;
  };
  this.followAgent = function (i) {
    this.mode = 'agent'; this.followIndex = i; this.autoSpin = false;
    this.wishSph.radius = 16; this.wishSph.phi = 0.40;
  };
  this.inspect = function (v3, h) {
    this.mode = 'building'; this.followIndex = -1; this.autoSpin = false;
    this.wish.set(v3.x, Math.max(8, h * 0.55), v3.z);
    this.wishSph.radius = Math.max(38, h * 1.7); this.wishSph.phi = 0.72;
  };
  this.frame = function (x, z, radius, phi, theta) {
    this.mode = 'god'; this.followIndex = -1; this.autoSpin = false;
    this.wish.set(x, 6, z);
    this.wishSph.radius = radius;
    if (phi != null) this.wishSph.phi = phi;
    if (theta != null) this.wishSph.theta = theta;
  };
  this.update = function (dt, sim) {
    if (this.spin) this.wishSph.theta += this.spin * dt * 0.9;
    if (this.autoSpin) this.wishSph.theta += dt * 0.075;
    if (this.mode === 'agent' && this.followIndex >= 0) {
      var i3 = this.followIndex * 3;
      this.wish.set(sim.pos[i3], sim.pos[i3 + 1] + 2.4, sim.pos[i3 + 2]);
    }
    var k = 1 - Math.pow(0.0026, dt);
    this.target.lerp(this.wish, k);
    this.sph.theta += (this.wishSph.theta - this.sph.theta) * k;
    this.sph.phi += (this.wishSph.phi - this.sph.phi) * k;
    this.sph.radius += (this.wishSph.radius - this.sph.radius) * k;
    var r = this.sph.radius, ph = this.sph.phi, th = this.sph.theta;
    camera.position.set(
      this.target.x + r * Math.cos(ph) * Math.sin(th),
      this.target.y + r * Math.sin(ph),
      this.target.z + r * Math.cos(ph) * Math.cos(th));
    camera.lookAt(this.target);
  };
}

/* =====================================================================
   BOOT
   ===================================================================== */
var stage = document.getElementById('stage');
var renderer = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
var DPR_CAP = MOBILE ? 1 : 1.25;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, DPR_CAP));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
stage.appendChild(renderer.domElement);

var scene = new T.Scene();
scene.background = new T.Color(0x03060d);
var camera = new T.PerspectiveCamera(48, innerWidth / innerHeight, 0.8, 2600);

var rnd = mulberry32(CFG.seed);
var cityData = buildCity(rnd);
var buildings = makeBuildingMesh(cityData.boxes);
scene.add(buildings);

var ground = new T.Mesh(new T.PlaneGeometry(2400, 2400, 1, 1), new T.ShaderMaterial({
  vertexShader: SH.groundVert, fragmentShader: SH.groundFrag,
  uniforms: { uTime: { value: 0 }, uFog: { value: new T.Color(0x050a15) },
              uFogK: { value: 0.0031 }, uWet: { value: 0 }, uNight: { value: 1 },
              uStreet: { value: STREET }, uLane: { value: LANE } },
  extensions: { derivatives: true }
}));
ground.rotation.x = -Math.PI / 2;

/* Rain is the one weather that needs geometry. It rides with the camera so a
   shower is everywhere rather than a patch you can walk out of, and it reuses
   the point shader the motes and trails already run on — no new material. */

  var g = new T.BufferGeometry();
  var pos = new Float32Array(count * 3), size = new Float32Array(count);
  var col = new Float32Array(count * 3), fade = new Float32Array(count);
  for (var i = 0; i < count; i++) {
    pos[i * 3] = (rnd() - 0.5) * 520;
    pos[i * 3 + 1] = rnd() * 95;
    pos[i * 3 + 2] = (rnd() - 0.5) * 520;
    size[i] = 0.5 + rnd() * 1.0;
    col[i * 3] = 0.45; col[i * 3 + 1] = 0.72; col[i * 3 + 2] = 0.95;
    fade[i] = 0;
  }

  g.setAttribute('aSize', new T.BufferAttribute(size, 1));

function syncAgents(dt) {
  for (var i = 0; i < SIM.N; i++) {
    var i3 = i * 3;

      fleet.mesh.setMatrixAt(i, _m);

      agGlow.array[i] = 0; agStride.array[i] = 0;
      headSize.array[i] = 0; headFade.array[i] = 0;

    }
    var dx = SIM.pos[i3] - SIM.prev[i3], dz = SIM.pos[i3 + 2] - SIM.prev[i3 + 2];

       body instead of sliding. Indoors they keep a slow floor circuit. */

    var riding = SIM.fly[i] && (SIM.phase[i] === 0 || SIM.phase[i] === 1);
    agPhase.array[i] = (agPhase.array[i] + dist * 2.4 + 0.015) % 6.2831853;
    /* Nobody walks in a car. Without this the legs pump at cruise speed and
       the whole thing reads as a bug rather than a ride. */

       sitting looks like from outside a car. Eased with the pod so the agent
       settles onto the deck at both ends instead of dropping. */

      bg.aGlow.array[0] = agGlow.array[i];
      bg.aPhase.array[0] = agPhase.array[i];
      bg.aStride.array[0] = agStride.array[i];

    headPos.array[i3 + 2] = SIM.pos[i3 + 2];

    headCol.array[i3] = cl.r; headCol.array[i3 + 1] = cl.g; headCol.array[i3 + 2] = cl.b;

  rides.instanceMatrix.needsUpdate = true;

var trailAccum = 0;
function syncTrails(dt) {

  for (var i = 0; i < SIM.N; i++) {
    var o = (i * fleet.trailLen + slot), o3 = o * 3, i3 = i * 3;
    var sc = SIM.scale[i];

    trPos.array[o3 + 1] = SIM.pos[i3 + 1] + 0.55;
    trPos.array[o3 + 2] = SIM.pos[i3 + 2];
    var cl = (i >= SIM.base && SIM.live[i]) ? userColor : stateColors[SIM.state[i]];
    trCol.array[o3] = cl.r; trCol.array[o3 + 1] = cl.g; trCol.array[o3 + 2] = cl.b;
    trSize.array[o] = 2.3 * sc;

    var v = openBox[b] + (target - openBox[b]) * k;
    /* Snap the tail of the ease to zero. An exponential approach never quite
       arrives, and "never quite arrives" would mean re-uploading fifteen
       thousand interior alphas on every frame of a city that is shut. */

    if (v !== openBox[b]) { openBox[b] = v; changed = true; }
    openAttr.array[b] = v;
  }
  for (var i = 0; i < cityData.sites.length; i++) {
    var st = cityData.sites[i];
    var d = SIM.door[i];

    markers.rings.setMatrixAt(i, _m);

  _sky.lerp(new T.Color(0xc28e72), twilight);

     buffer, so thinning traffic costs one assignment rather than a second pool

/* ---- main loop ---- */
var clock = new T.Clock();
var frames = 0, fpsT = 0, fps = 60, uiT = 0;
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) { clock.getDelta(); return; }
  var dt = Math.min(clock.getDelta(), 0.1);
  var time = clock.elapsedTime;

  SIM.step(dt);
  syncAgents(dt);
  syncTrails(dt);
  syncSites(dt);
  syncLifts(time);
  syncUserBodies(dt, time);
  syncTraffic(dt, time);
  syncFlyers(dt, time);
  syncSignals(time);

  syncSky(dt, time);
  water.material.uniforms.uTime.value = time;
  buildings.material.uniforms.uTime.value = time;
  ground.material.uniforms.uTime.value = time;
  flows.material.uniforms.uTime.value = time;
  foliage.material.uniforms.uTime.value = time;

  landmarks.forEach(function (g) {
    if (g.userData.core) { g.userData.core.rotation.y += dt * 0.24; g.userData.core.rotation.x += dt * 0.11; }
    if (g.userData.spinGroup) g.userData.spinGroup.rotation.y += dt * 0.8;
    g.children.forEach(function (ch) { if (ch.userData.spin) ch.rotation.z += dt * ch.userData.spin; });
  });
  motes.rotation.y += dt * 0.007;

  rig.update(dt, SIM);
  syncLabels();
  syncInteriorLabels();

  renderer.setRenderTarget(bloom.main);
  renderer.clear();
  renderer.render(scene, camera);
  /* Fog eats contrast, so the bloom has to come down with it or the city turns
     into a single glowing smear. */
  bloom.render(time, quality.bloom * (1 - 0.3 * SIM.weather.fog));

  frames++; fpsT += dt;
  if (fpsT >= 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; tuneQuality(fps); }
  uiT += dt;
  if (uiT >= 0.25) { uiT = 0; UIBUS.pump && UIBUS.pump(fps); }
}
