        var real = REAL.byDistrict[dlabs[d].key];
        var realFresh = real && (Date.now() - new Date(real.startedAt).getTime()) < 30 * 60 * 1000;
        dlabs[d].live.style.display = realFresh ? 'block' : 'none';
        if (realFresh) {
          dlabs[d].live.style.background = real.status === 'FAILED' ? '#ff5c5c'
            : real.status === 'RUNNING' ? '#38d6ff' : '#3ddc97';
          dlabs[d].live.title = real.source + ' · ' + (real.project || 'run') + ' · ' + real.status;
        }
      }
      var fresh = SIM.events.filter(function (ev) { return ev.id > lastEv.current; });
      if (fresh.length) {
        lastEv.current = SIM.events[SIM.events.length - 1].id;
        var mapped = fresh.slice(-6).map(function (ev) {
          var mine = ev.agent >= SIM.base;
          var u2 = SIM.userOf(ev.agent);
          return { id: ev.id, t: hhmmss(ev.t),
            agent: mine && u2 ? u2.name : 'A' + (0x1000 + ev.agent).toString(16).toUpperCase(),
            site: SIM.sites[ev.site] ? SIM.sites[ev.site].label : '—',
            text: ev.text, kind: ev.kind,
            color: mine ? USER_HEX : STATE_COLOR[SIM.state[ev.agent]] };
        });
        setLogs(function (prev) { return prev.concat(mapped).slice(-26); });
      }
      var s = selRef.current;
      if (s && s.type === 'agent') setSelected(Object.assign({ type: 'agent' }, SIM.agentInfo(s.index)));
    };
    UIBUS.selectAgent = function (i) { setSelected(Object.assign({ type: 'agent' }, SIM.agentInfo(i))); };
    UIBUS.selectSite = function (siteIdx, boxIdx) {
      if (siteIdx >= 0) {
        var st2 = SIM.sites[siteIdx];
        setSelected({ type: 'site', index: siteIdx, label: st2.label,
          district: DISTRICTS[st2.district].name, col: st2.col });
      } else setSelected({ type: 'block', index: boxIdx });
    };
    UIBUS.pump(60);
    return function () { UIBUS.pump = null; };
  }, []);

  /* Tour steps advance on a timer and stop the moment you touch anything. */
  React.useEffect(function () {
    if (tour < 0) return undefined;
    if (tour >= TOUR.length) { setTour(-1); rig.god(); return undefined; }
    var step = TOUR[tour];
    if (step.d < 0) rig.frame(0, 0, step.r, step.phi, rig.wishSph.theta);
    else {
      var D = DISTRICTS[step.d];
      rig.frame(D.x, D.z, step.r, step.phi, Math.atan2(D.x, D.z) + 2.4);
    }
    rig.autoSpin = true;
    tourTimer.current = setTimeout(function () { setTour(tour + 1); }, 7000);
    return function () { clearTimeout(tourTimer.current); };
  }, [tour]);

  function stopTour() { setTour(-1); rig.autoSpin = false; }
  function startTour() { setGate(false); seen(true); setSelected(null); pickState.site = -1; pickState.box = -1; setTour(0); }
  function explore() { setGate(false); seen(true); rig.god(); }
  function openMaker() { setGate(false); seen(true); stopTour(); setMaker(true); }

  function changeAvatar(index, key) {
    var rec = SIM.setAvatar(index, key);
    if (!rec) return;
    swapUserBody(rec);
    setRoster(SIM.users.slice());
    setSelected(Object.assign({ type: 'agent' }, SIM.agentInfo(index)));
  }

  function changeVoice(index, key) {
    var rec = SIM.setVoice(index, key);
    if (!rec) return;
    setRoster(SIM.users.slice());
    setSelected(Object.assign({ type: 'agent' }, SIM.agentInfo(index)));
  }

  function create(name, avatarKey, role, voiceKey) {
    var rec = SIM.createUser(name, avatarKey, role, voiceKey);
    setMaker(false);
    if (!rec) return;
    addUserBody(rec);
    setRoster(SIM.users.slice());
    rig.followAgent(rec.index);
    UIBUS.selectAgent(rec.index);
  }

  var full = roster.length >= USER_MAX;

  function dockBtn(key, icon, label, onClick, active, extra) {
    return e('button', Object.assign({
      key: key, className: 'ib' + (active ? ' on' : ''), onClick: onClick,
      title: label, 'aria-label': label
    }, extra || {}), e(Icon, { d: icon }), e('span', { className: 'lb' }, label));
  }

  var step = tour >= 0 && tour < TOUR.length ? TOUR[tour] : null;

  return e(React.Fragment, null,
    gate ? e(Gate, { onTour: startTour, onFree: explore, onCreate: openMaker }) : null,
    maker ? e(Maker, { onCreate: create, onClose: function () { setMaker(false); },
      /* Next unused voice, so eight agents are eight different comedians
         unless the visitor deliberately picks otherwise. */
      defaultVoice: VOICES[roster.length % VOICES.length].key }) : null,

    e('div', { className: 'panel brand' },
      e('span', { className: 'mk' },
        e('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: '#38d6ff', strokeWidth: 1.7 },
          e('path', { d: 'M12 2 L21 7 v10 l-9 5 -9-5 V7 z' }),
          e('path', { d: 'M12 12 v10' }),
          e('path', { d: 'M3 7 l9 5 9-5' }))),
      e('div', null,
        e('h1', null, 'AGENTIC CITY'),
        e('div', { className: 's' },
          hhmm(snap.hour || 0) + ' · ' + String(snap.weather || 'clear').toUpperCase()))),

    e('div', { className: 'metrics' + (SMALL && step ? ' hide-sm' : '') },
      e(Metric, { label: 'Agents', value: fmt(snap.total), sub: 'live in the city', color: 'var(--cyan)' }),
      e(Metric, { label: 'Working', value: fmt(snap.active),
        sub: snap.total ? Math.round(snap.active / snap.total * 100) + '% of fleet' : '—' }),
      e(Metric, { label: 'Tasks done', value: fmt(snap.tasksDone), sub: 'since you arrived', color: 'var(--green)' }),
      SMALL ? null : e(Metric, { label: 'Impact', value: snap.impact.toFixed(0), sub: 'skill-weighted output', color: 'var(--amber)' }),
      SMALL ? null : e(Metric, { label: 'Yours', value: String(snap.mine), sub: snap.mine ? 'follow one below' : 'none yet',
        color: snap.mine ? hex(USER_HEX) : 'var(--faint)' }),
      SMALL ? null : e(Metric, { label: 'Sky', value: hhmm(snap.hour || 0),
        sub: (snap.night > 0.6 ? 'night · ' : snap.night > 0.3 ? 'dusk · ' : 'day · ') +
             String(snap.weather || 'clear'),
        color: snap.night > 0.6 ? 'var(--violet)' : 'var(--cyan)' })),

    SMALL ? null : e('div', { className: 'fps mono' },
      e('div', null, Math.round(fpsv) + ' fps'),
      e('div', { style: { color: quality.level === 'full' ? 'var(--faint)' : 'var(--amber)' } }, 'quality ' + quality.level)),

    /* ---- the dock ---- */
    e('div', { className: 'panel dock labelled' },
      dockBtn('rl', ICONS.rotL, 'Rotate', function () {}, false, {
        onPointerDown: function () { rig.spin = 1; stopTour(); },
        onPointerUp: function () { rig.spin = 0; },
        onPointerLeave: function () { rig.spin = 0; },
        onClick: function () { rig.orbit(0.5, 0); }
      }),
      dockBtn('rr', ICONS.rotR, 'Rotate', function () {}, false, {
        onPointerDown: function () { rig.spin = -1; stopTour(); },
        onPointerUp: function () { rig.spin = 0; },
        onPointerLeave: function () { rig.spin = 0; },
        onClick: function () { rig.orbit(-0.5, 0); }
      }),
      dockBtn('zi', ICONS.zoomIn, 'Closer', function () { rig.zoomBy(0.72); stopTour(); }),
      dockBtn('zo', ICONS.zoomOut, 'Further', function () { rig.zoomBy(1.38); stopTour(); }),
      e('span', { className: 'sep', key: 's1' }),
      dockBtn('hm', ICONS.home, 'Reset', function () { rig.god(); pickState.site = -1; pickState.box = -1; setSelected(null); stopTour(); }),
      dockBtn('xr', ICONS.xray, 'See inside', function () { XRAY.on = !XRAY.on; setXray(XRAY.on); }, xray),
      /* Off until this is pressed, and the press is the gesture the browser
         wants before it will make a sound. Hidden entirely where the browser
         has no synthesiser rather than offered as a button that does nothing. */
      TTS.ok ? dockBtn('vo', ICONS.voice, 'Speak', function () {
        var on = TTS.toggle();
        setVox(on);
        /* A silent synthesiser is indistinguishable from a quiet city, so it
           says something the instant it is switched on. */
        if (on) TTS.say(roster.length ? roster[0].voice : 'deadpan',
          roster.length ? 'Voice on. You can hear us now.'
                        : 'Voice on. Create an agent and it will start talking.');
      }, vox) : null,
      dockBtn('tr', ICONS.tour, 'Tour', function () { tour >= 0 ? stopTour() : startTour(); }, tour >= 0),
      e('span', { className: 'sep', key: 's2' }),
      e('button', { key: 'mk', className: 'cta', onClick: openMaker, disabled: full,
        title: full ? 'You have made the maximum of ' + USER_MAX : 'Create your own agent' },
        e(Icon, { d: ICONS.plus }), SMALL ? 'Agent' : (full ? 'Roster full' : 'Create agent'))),

    /* ---- tour caption ---- */
    step ? e('div', { className: 'panel caption' },
      e('h3', null, step.title),
      e('p', null, step.body),
      e('p', { style: { marginTop: 8, fontSize: 10.5, color: 'var(--faint)',
        fontFamily: '"JetBrains Mono",monospace', letterSpacing: '.12em' } },
        (tour + 1) + ' / ' + TOUR.length + ' · TAP ANYTHING TO STOP')) : null,

    /* ---- right rail ---- */
    /* On a phone the rail and the selection panel occupy the same slot, so
       only one is ever on screen. The selection is what you just tapped, so
       it wins. */
    e('div', { className: 'rail' + (SMALL && (selected || step) ? ' hide-sm' : '') },
      roster.length ? e('div', { className: 'panel card' },
        e('h2', { className: 'ph' }, 'Your agents'),
        roster.map(function (u) {
          var A = AVATARS.filter(function (x) { return x.key === u.avatar; })[0] || AVATARS[0];
          return e('button', { className: 'rost', key: u.index,
            onClick: function () { stopTour(); rig.followAgent(u.index); UIBUS.selectAgent(u.index); } },
            e('span', { className: 'av2' }, e(Icon, { d: A.d })),
            e('span', { className: 'rn2' }, u.name),
            e('span', { className: 'rs' }, 'FOLLOW'));
        })) : null,

      e('div', { className: 'panel card' },
        e('h2', { className: 'ph' }, 'What the colours mean'),
        STATES.map(function (name, i) {
          return e(Flow, { key: name, name: name.charAt(0) + name.slice(1).toLowerCase(),
            n: snap.counts[i], total: snap.total, color: hex(STATE_COLOR[i]) });
        })),

      e('div', { className: 'panel card' },
        e('h2', { className: 'ph' }, 'Districts'),
        DISTRICTS.map(function (D) {
          return e('button', { className: 'rost', key: D.key,
            onClick: function () { stopTour(); rig.frame(D.x, D.z, 120, 0.45, Math.atan2(D.x, D.z) + 2.4); } },
            e('span', { className: 'dot', style: { background: hex(D.col), color: hex(D.col) } }),
            e('span', { className: 'rn2', style: { fontSize: 11.5 } }, D.name),
            e('span', { className: 'rs' }, 'VISIT'));
        }))),

    SMALL ? null : e('div', { className: 'panel log' },
      e('h2', { className: 'ph' }, 'City log'),
      e('div', { className: 'loglines' },
        logs.slice().reverse().map(function (L) {
          return e('div', { className: 'll', key: L.id },
            e('span', { className: 't' }, L.t),
            e('span', null,
              e('b', { style: { color: hex(L.color) } }, L.agent), ' ', L.text,
              L.kind === 'enter' ? e('span', null, ' ', e('b', { style: { color: 'var(--dim)' } }, L.site)) : null));
        }))),

    /* ---- selection ---- */
    selected ? e('div', { className: 'panel sel' },
      selected.type === 'agent'
        ? e(React.Fragment, null,
            e('div', { className: 'selhead', style: { color: selected.mine ? hex(USER_HEX) : hex(STATE_COLOR[selected.stateIdx]) } },
              e('span', { className: 'ring' },
                selected.mine
                  ? e(Icon, { d: (AVATARS.filter(function (x) { return x.key === selected.avatar; })[0] || AVATARS[0]).d })
                  : selected.id.slice(1, 3)),
              e('div', { style: { minWidth: 0 } },
                e('div', { className: 'nm' }, selected.mine ? selected.name : 'Agent ' + selected.id),
                e('div', { className: 'st' },
                  (selected.mine
                    ? selected.roleName + ' · ' + avatarOf(selected.avatar).name
                    : selected.state.toLowerCase()) + ' · ' + selected.phase)),
              e('button', { className: 'close', 'aria-label': 'Close',
                onClick: function () { setSelected(null); pickState.site = -1; pickState.box = -1; rig.god(); } }, '×')),
            e(KV, { k: 'Doing', v: selected.task }),
            e(KV, { k: 'Where', v: selected.inside
              ? selected.location + ' · floor ' + selected.floor + ' of ' + selected.floors
              : 'walking, in transit' }),
            e(KV, { k: 'Heading to', v: selected.destination }),
            e(Bar, { k: 'Task', v: Math.round(selected.progress * 100) + '%', pct: selected.progress * 100,
              color: selected.mine ? hex(USER_HEX) : hex(STATE_COLOR[selected.stateIdx]) }),
            e(Bar, { k: 'Skill', v: selected.skill.toFixed(2) + ' / 10', pct: selected.skill * 10, color: 'var(--green)' }),
            e(Bar, { k: 'Energy', v: Math.round(selected.energy * 100) + '%', pct: selected.energy * 100, color: 'var(--amber)' }),
            selected.mine ? e(React.Fragment, null,
              e('h2', { className: 'ph', style: { marginTop: 14 } }, 'Body'),
              e('div', { className: 'avrow' },
                AVATARS.map(function (A) {
                  return e('button', { key: A.key, type: 'button',
                    className: 'avmini' + (selected.avatar === A.key ? ' on' : ''),
                    title: A.name, 'aria-label': 'Give it the ' + A.name + ' body',
                    'aria-pressed': selected.avatar === A.key,
                    onClick: function () { changeAvatar(selected.index, A.key); } },
                    e(Icon, { d: A.d }));
                })),
              e('h2', { className: 'ph', style: { marginTop: 14 } }, 'Sense of humour'),
              e('div', { className: 'avrow' },
                VOICES.map(function (V) {
                  return e('button', { key: V.key, type: 'button',
                    className: 'vchip' + (selected.voice === V.key ? ' on' : ''),
                    'aria-pressed': selected.voice === V.key,
                    onClick: function () { changeVoice(selected.index, V.key); } }, V.name);
                })),
              selected.thought
                ? e('p', { style: { margin: '10px 0 0', fontSize: 11.5, lineHeight: 1.45,
                    color: '#ffdcbd' } },
                    (MOOD_EMOJI[selected.mood] || '') + '  ' + selected.thought)
                : e('p', { className: 'jempty', style: { marginTop: 10 } },
                    'Currently ' + selected.mood + ' and keeping it to itself.'),

              e('h2', { className: 'ph', style: { marginTop: 14 } },
                'Journey · ' + mmss(snap.time - selected.born) + ' old'),
              selected.journey && selected.journey.length
                ? selected.journey.slice(-12).reverse().map(function (j) {
                    return e('div', { className: 'jr', key: j.id },
                      e('span', { className: 't' }, hhmmss(j.t)),
                      e('span', null, j.text, j.kind === 'enter' && j.site
                        ? e('span', { style: { color: 'var(--dim)' } }, ' ' + j.site) : null));
                  })
                : e('p', { className: 'jempty' }, 'Just arrived. Its first move shows up here within a few seconds.')
            ) : null)
        : selected.type === 'site'
          ? e(React.Fragment, null,
              e('div', { className: 'selhead', style: { color: hex(selected.col) } },
                e('span', { className: 'ring' }, 'SITE'),
                e('div', { style: { minWidth: 0 } },
                  e('div', { className: 'nm', style: { fontSize: 11.5 } }, selected.label),
                  e('div', { className: 'st' }, selected.district)),
                e('button', { className: 'close', 'aria-label': 'Close',
                  onClick: function () { setSelected(null); pickState.site = -1; pickState.box = -1; rig.god(); } }, '×')),
              e(KV, { k: 'Inside now', v: String(SIM.occupancy[selected.index]) }),
              e(KV, { k: 'Utilisation', v: Math.round(SIM.busy[selected.index] * 100) + '%' }),
              e(KV, { k: 'Storeys', v: String(SIM.sites[selected.index].floors) }),
              e(KV, { k: 'Work here', v: STATES[SIM.sites[selected.index].bias].toLowerCase() }))
          : e(React.Fragment, null,
              e('div', { className: 'selhead', style: { color: 'var(--dim)' } },
                e('span', { className: 'ring' }, '—'),
                e('div', null,
                  e('div', { className: 'nm', style: { fontSize: 11.5 } }, 'Unnamed block'),
                  e('div', { className: 'st' },
                    (cityData.boxes[selected.index].floors) + ' storeys · no agents work here')),
                e('button', { className: 'close', 'aria-label': 'Close',
                  onClick: function () { setSelected(null); pickState.site = -1; pickState.box = -1; rig.god(); } }, '×')),
              e('p', { className: 'jempty' },
                'City fabric — floored, furnished and running its lift like everywhere else. ',
                'Only the towers with a spinning ring above them take agents, so this one is lit and empty.'))
    ) : null);
}

ReactDOM.createRoot(document.getElementById('ui')).render(e(App));
document.getElementById('boot').remove();
frame();

})();
</script>

</body></html>
