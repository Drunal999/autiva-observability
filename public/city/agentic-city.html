<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style><style>
html[data-dashboard="true"] .brand,
html[data-dashboard="true"] .metrics,
html[data-dashboard="true"] .rail,
html[data-dashboard="true"] .fps,
html[data-dashboard="true"] .log {display:none!important}
html[data-dashboard="true"] .dlab .m,
html[data-dashboard="true"] .dlab .b {display:none!important}
</style>
<script>if(new URLSearchParams(location.search).get('dashboard')==='1')document.documentElement.dataset.dashboard='true';</script>
</head><body>
<title>Agentic City Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --void:#03060d; --glass:rgba(9,17,31,.74); --glass-2:rgba(7,13,25,.9);
    --edge:rgba(56,214,255,.20); --edge-hot:rgba(56,214,255,.55);
    --ink:#dbe7fa; --dim:#7f96b8; --faint:#48597a;
    --cyan:#38d6ff; --violet:#a878ff; --green:#3ddc97; --amber:#ffc663; --pink:#ff6bd6; --red:#ff7a6b;
    /* The six cool hues are spoken for by the six agent states. Yours is warm
       so it never reads as "just another state" anywhere in the city. */
    --user:#ff9f5a; --user-dim:rgba(255,159,90,.16); --user-edge:rgba(255,159,90,.55);
    --dock-h:64px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;
    font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;font-size:13px;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:3}
  #ui > *{pointer-events:auto}
  #ui .hint,#ui .fps,#ui .caption{pointer-events:none}

  .panel{background:var(--glass);border:1px solid var(--edge);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(160,220,255,.07)}
  .ph{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.19em;
    text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;margin:0 0 9px}
  .ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

  button{font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink);
    background:rgba(12,24,42,.85);border:1px solid rgba(56,214,255,.3);border-radius:8px;padding:8px 12px}
  button:hover{border-color:var(--edge-hot);color:var(--cyan)}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  button.on{background:var(--cyan);color:#04121b;border-color:var(--cyan)}
  button:disabled{opacity:.4;cursor:default}

  /* ---------- identity ---------- */
  .brand{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:11px;padding:10px 14px 10px 12px}
  .brand .mk{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
    border:1px solid var(--edge-hot);box-shadow:0 0 20px rgba(56,214,255,.28), inset 0 0 16px rgba(56,214,255,.14)}
  .brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.13em;line-height:1}
  .brand .s{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.26em;color:var(--amber);margin-top:5px}

  /* ---------- metrics ---------- */
  .metrics{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .metric{padding:8px 14px 9px;min-width:106px;text-align:left}
  .metric .l{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.17em;color:var(--faint);text-transform:uppercase}
  .metric .v{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;line-height:1.2;margin-top:3px;
    font-variant-numeric:tabular-nums}
  .metric .d{font-size:10px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}

  /* ---------- right rail ---------- */
  .rail{position:absolute;top:14px;right:14px;width:242px;display:flex;flex-direction:column;gap:9px;
    max-height:calc(100vh - 28px - var(--dock-h));overflow:auto;scrollbar-width:thin}
  .rail::-webkit-scrollbar{width:6px}
  .rail::-webkit-scrollbar-thumb{background:rgba(56,214,255,.22);border-radius:3px}
  .card{padding:12px 13px}
  .flow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12px}
  .flow + .flow{border-top:1px solid rgba(56,214,255,.09)}
  .dot{width:8px;height:8px;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor}
  .flow .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px}
  .bar{height:3px;border-radius:2px;background:rgba(120,160,210,.13);margin-top:5px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:2px;transition:width .28s ease}
  .kv{display:flex;gap:9px;padding:4px 0;font-size:11.5px}
  .kv + .kv{border-top:1px solid rgba(56,214,255,.08)}
  .kv .k{color:var(--faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;width:84px;flex:none;padding-top:1px}
  .kv .v{color:var(--ink);font-weight:600}

  /* ---------- the dock: the one place controls live ---------- */
  .dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;
    gap:6px;padding:8px 9px;border-radius:14px}
  .dock .sep{width:1px;height:26px;background:var(--edge);flex:none;margin:0 2px}
  .ib{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:9px;position:relative}
  .ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ib .lb{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-family:"JetBrains Mono",monospace;
    font-size:8px;letter-spacing:.1em;color:var(--faint);white-space:nowrap;pointer-events:none}
  .dock.labelled{margin-bottom:0;padding-bottom:20px}
  .cta{padding:9px 15px;border-radius:9px;font-weight:700;font-size:12px;
    background:var(--user-dim);border-color:var(--user-edge);color:var(--user);display:flex;align-items:center;gap:7px}
  .cta:hover{background:var(--user);color:#1a0d03;border-color:var(--user)}
  .cta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

  /* ---------- log ---------- */
  .log{position:absolute;left:14px;bottom:calc(14px + var(--dock-h));width:min(440px,calc(100vw - 300px));padding:10px 12px}
  .loglines{max-height:96px;overflow:hidden}
  .ll{display:grid;grid-template-columns:58px 1fr;gap:9px;padding:3px 0;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;line-height:1.45}
  .ll .t{color:var(--faint)}
  .ll b{font-weight:600}

  /* ---------- selection / journey ---------- */
  .sel{position:absolute;right:14px;bottom:calc(14px + var(--dock-h));width:242px;padding:12px 13px;
    max-height:min(52vh,440px);overflow:auto;scrollbar-width:thin}
  .sel::-webkit-scrollbar{width:6px}
  .sel::-webkit-scrollbar-thumb{background:rgba(56,214,255,.22);border-radius:3px}
  .selhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .selhead .ring{width:30px;height:30px;border-radius:50%;flex:none;border:1.5px solid currentColor;
    display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;
    box-shadow:0 0 14px currentColor}
  .selhead .nm{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;letter-spacing:.05em}
  .selhead .st{font-size:10px;color:var(--dim);margin-top:1px}
  .close{margin-left:auto;background:none;border:none;color:var(--faint);font-size:17px;padding:0 4px;line-height:1}
  .close:hover{color:var(--red);border:none;background:none}
  .jr{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 0;font-size:10.5px;line-height:1.45;
    font-family:"JetBrains Mono",monospace}
  .jr + .jr{border-top:1px solid rgba(56,214,255,.07)}
  .jr .t{color:var(--faint)}
  .jempty{font-size:11px;color:var(--faint);line-height:1.5;margin:2px 0 0}

  /* ---------- captions / hints ---------- */
  .caption{position:absolute;left:50%;bottom:calc(28px + var(--dock-h));transform:translateX(-50%);
    max-width:min(520px,calc(100vw - 40px));text-align:center;padding:13px 20px;border-radius:12px}
  .caption h3{margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:.02em}
  .caption p{margin:0;font-size:12px;color:var(--dim);line-height:1.55}
  .fps{position:absolute;top:14px;right:268px;font-family:"JetBrains Mono",monospace;font-size:10px;
    color:var(--faint);text-align:right;line-height:1.6}

  /* ---------- in-world labels ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:2}
  .dlab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
    padding:6px 10px 7px;border-radius:9px;background:rgba(6,12,24,.7);
    border:1px solid currentColor;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 0 22px rgba(0,0,0,.5); transition:opacity .2s ease}
  .dlab .n{font-weight:700}
  .dlab .m{color:#7f96b8;letter-spacing:.07em;font-size:9px;margin-top:3px}
  .dlab .b{height:2px;background:rgba(120,160,210,.18);border-radius:2px;margin-top:5px;overflow:hidden}
  .dlab .b i{display:block;height:100%;background:currentColor;transition:width .3s ease}
  /* Real-run signal: a small dot, colour = live status, only shown when a
     real backend run has landed for this district in the last 30 minutes. */
  .dlab .live{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;
    box-shadow:0 0 8px currentColor;animation:liveBlink 1.6s ease-in-out infinite}
  @keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.35}}
  /* One per agent inside the building you have open — who they are and the
     job they are on. This is the whole point of cutting a tower open. */
  .tlab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;
    font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.05em;
    padding:3px 8px 4px;border-radius:7px;background:rgba(4,9,18,.88);
    border:1px solid currentColor;box-shadow:0 0 14px rgba(0,0,0,.6);
    transition:opacity .18s ease}
  .tlab b{font-weight:700}
  .tlab i{font-style:normal;color:var(--dim);letter-spacing:.02em}
  .ulab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;color:var(--user);
    font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.1em;
    padding:4px 9px 5px;border-radius:99px;background:rgba(26,13,3,.82);border:1px solid var(--user-edge);
    box-shadow:0 0 18px rgba(255,159,90,.35);transition:opacity .2s ease}

  /* ---------- welcome ---------- */
  #gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:22px;
    background:radial-gradient(ellipse at 50% 44%,rgba(3,10,22,.72),rgba(2,4,10,.95) 70%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .gate{width:min(520px,100%);padding:26px 26px 22px;text-align:left}
  .gate .eyebrow{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.3em;color:var(--cyan);
    text-transform:uppercase}
  .gate h2{margin:11px 0 0;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.01em;
    line-height:1.15;text-wrap:balance}
  .gate p{margin:11px 0 0;font-size:13.5px;line-height:1.62;color:var(--dim);max-width:60ch}
  .gate .legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:16px 0 0;padding:13px 0 0;
    border-top:1px solid var(--edge)}
  .gate .lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
  .gate .acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}
  .gate .acts button{padding:11px 16px;font-size:12.5px}
  .gate .primary{background:var(--cyan);color:#04121b;border-color:var(--cyan)}
  .gate .primary:hover{background:#7ee6ff;color:#04121b;border-color:#7ee6ff}

  /* ---------- create-agent sheet ---------- */
  #maker{position:fixed;inset:0;z-index:11;display:grid;place-items:center;padding:20px;
    background:rgba(2,4,10,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .maker{width:min(520px,100%);padding:22px;max-height:calc(100vh - 40px);overflow:auto}
  .maker h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .maker .sub{margin:6px 0 0;font-size:12px;color:var(--dim);line-height:1.55}
  .field{margin-top:17px}
  .field > label{display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  input[type=text]{width:100%;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink);
    background:rgba(4,10,20,.9);border:1px solid var(--edge);border-radius:9px;padding:11px 12px}
  input[type=text]:focus{outline:none;border-color:var(--user-edge);box-shadow:0 0 0 3px var(--user-dim)}
  .avatars{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
  .av{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:11px;
    background:rgba(8,16,30,.7);border:1px solid var(--edge);cursor:pointer;color:var(--ink)}
  .av:hover{border-color:var(--user-edge)}
  .av.on{background:var(--user-dim);border-color:var(--user);color:var(--user)}
  .av svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round}
  .av span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
  .roles{display:grid;gap:7px}
  .role{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-align:left;
    background:rgba(8,16,30,.7);border:1px solid var(--edge);cursor:pointer;color:var(--ink);width:100%}
  .role:hover{border-color:var(--edge-hot)}
  .role.on{border-color:currentColor;background:rgba(56,214,255,.08)}
  .role .rn{font-weight:700;font-size:12px}
  .role .rd{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}
  .maker .acts{display:flex;gap:9px;margin-top:20px;justify-content:flex-end}
  .maker .go{background:var(--user);color:#1a0d03;border-color:var(--user);font-weight:700;padding:11px 18px}
  .maker .go:hover{background:#ffb87e;color:#1a0d03;border-color:#ffb87e}
  .err{margin:9px 0 0;font-size:11.5px;color:var(--red)}

  /* ---------- roster ---------- */
  .rost{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;width:100%;
    background:none;border:none;border-radius:0;text-align:left;color:var(--ink);cursor:pointer}
  .rost + .rost{border-top:1px solid rgba(56,214,255,.09)}
  .rost:hover{background:none;border:none;color:var(--user)}
  .rost:hover .rn2{color:var(--user)}
  .rost .av2{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;
    border:1px solid var(--user-edge);color:var(--user)}
  .rost .av2 svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
  .rost .rn2{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rost .rs{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--faint);flex:none}

  /* ---------- what your agent is thinking ---------- */
  .think{position:absolute;left:0;top:0;max-width:214px;will-change:transform;
    font-size:11.5px;line-height:1.38;padding:7px 11px 8px;border-radius:13px;
    background:rgba(28,14,4,.9);border:1px solid var(--user-edge);color:#ffdcbd;
    box-shadow:0 0 22px rgba(255,159,90,.3);backdrop-filter:blur(6px);
    transition:opacity .3s ease;pointer-events:none;text-wrap:pretty}
  .think .em{margin-right:6px}
  .think .vv{display:block;font-family:"JetBrains Mono",monospace;font-size:8px;
    letter-spacing:.17em;text-transform:uppercase;color:#a8785a;margin-top:5px}

  /* ---------- body switcher, lives in the selection panel ---------- */
  .avrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .avmini{width:33px;height:33px;padding:0;display:grid;place-items:center;border-radius:9px;
    background:rgba(8,16,30,.7);border:1px solid var(--edge);color:var(--dim)}
  .avmini:hover{border-color:var(--user-edge);color:var(--user)}
  .avmini svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
  .avmini.on{background:var(--user-dim);border-color:var(--user);color:var(--user)}
  .vchip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;
    background:rgba(8,16,30,.7);border:1px solid var(--edge);color:var(--dim)}
  .vchip:hover{border-color:var(--user-edge);color:var(--user)}
  .vchip.on{background:var(--user-dim);border-color:var(--user);color:var(--user)}

  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:20}
  #boot .b{text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.24em;color:var(--cyan)}
  #boot .sub{color:var(--faint);letter-spacing:.1em;font-size:10px;margin-top:9px}

  /* ---------- mobile ---------- */
  @media (max-width:900px){
    :root{--dock-h:58px}
    .brand{padding:8px 12px 8px 10px;gap:9px}
    .brand h1{font-size:13px}
    .brand .mk{width:27px;height:27px}
    .fps{display:none}
    .log{display:none}
    /* Three panels used to resolve to the same bottom edge and stack on top
       of each other. They are now a column: dock, then metrics, then
       whichever of rail/selection is open — never both, see .hide. */
    .metrics{position:absolute;top:auto;bottom:calc(12px + var(--dock-h));left:12px;right:12px;transform:none;
      display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .metric{min-width:0;padding:7px 9px 8px}
    .metric .v{font-size:15px}
    .metric .d{display:none}
    .rail{top:auto;bottom:calc(70px + var(--dock-h));left:12px;right:12px;width:auto;
      max-height:min(38vh,290px)}
    .sel{left:12px;right:12px;bottom:calc(70px + var(--dock-h));width:auto;max-height:min(42vh,320px)}
    .caption{bottom:calc(20px + var(--dock-h));max-width:calc(100vw - 24px);padding:11px 15px}
    .hide-sm{display:none !important}
    .dock{left:12px;right:12px;bottom:10px;transform:none;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
      scrollbar-width:none}
    .dock::-webkit-scrollbar{display:none}
    .ib{width:34px;height:34px}
    .ib .lb{display:none}
    .dock.labelled{padding-bottom:9px}
    .cta{padding:8px 12px;font-size:11.5px}
  }
  @media (prefers-reduced-motion: reduce){ .bar > i,.dlab,.ulab{transition:none} }
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="ui"></div>
<div id="boot"><div><div class="b">BUILDING THE CITY</div><div class="sub">districts · agents · routes</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* =====================================================================
   AGENTIC CITY
   A real-time 3D simulation of an agent fleet, built so a first-time
   visitor can operate it without being taught anything.

   Three things drive every decision in the UI layer below:
     1. Nothing is discovered by guessing. Every action has a labelled
        button. Gestures are a shortcut for people who already know them,
        never the only way to do something.
     2. Touch is a first-class input. One finger orbits, two fingers
        pinch-zoom and pan. (The previous build had no pinch and required
        right-click to pan, so a phone could orbit and nothing else.)
     3. You can put yourself in the city. Create an agent, pick its body,
        give it a job, then watch and read back its journey.

   THE DATA SEAM is unchanged: /simulation owns all state and exposes
   SIM.snapshot(). Replace the tick() body with rows from a real backend
   and the renderer and UI need no edits.
   ===================================================================== */
(function () {
'use strict';
var T = window.THREE;

/* Phones get a smaller fleet and less post-processing. Same city, same
   rules, fewer bodies — a 900-agent draw plus bloom at 2x DPR is what
   turns a mid-range Android into a slideshow. */

   A local cron signs into the autiva-observability dev server, reads
   /api/city, and writes the mapped snapshot to db doc "real/snapshot".
   This file only ever READS that doc — it never writes it.

   The dashboard's business districts (support, intelligence, finance,
   sales, marketing, operations) don't share names with this city's six
   districts, so they are hand-mapped below — a judgment call, not a
   discovered rule:
     intelligence -> data    (analysis maps to the Data Insights Tower)
     finance      -> impact  (automated invoice-chasing is deployed ops)
     sales        -> collab  (relationship work maps to Collaboration)

// Dashboard supplies tenant-scoped data; the scene owns no credentials.
window.addEventListener('message', function (event) {
  if (event.origin !== location.origin || event.source !== parent) return;
  if (!event.data || event.data.type !== 'autiva:city') return;
  var next = {};
  var data = event.data.payload;
  if (data && Array.isArray(data.districts)) data.districts.forEach(function(d) {
    var key = REAL_MAP[d.district];
    if (!key || !Array.isArray(d.runs)) return;
    d.runs.forEach(function(run) {
      if (!run || !Number.isFinite(Date.parse(run.startedAt))) return;
      if (!next[key] || Date.parse(run.startedAt) > Date.parse(next[key].startedAt))
        next[key] = {project:run.project, status:run.status, startedAt:run.startedAt, source:d.displayName};
    });
  });
  REAL.byDistrict = next;
});
parent.postMessage({type:'autiva:city-ready'}, location.origin);

/* THE AGENTS SPEAK OUT LOUD.
   `speechSynthesis` is the entire engine, and it is not a compromise, it is the
   only door: this page runs under a CSP that blocks every fetch, XHR and socket,
   so no hosted or self-hosted TTS — OmniVoice on localhost included — can be
   reached from inside the artifact. The browser's own synthesiser needs no
   network, no key and no money, and it speaks the moment the line is written.

   Off until somebody presses the button, which is also the user gesture browsers
   require before any audio may play. Turning it on IS the permission. */
var TTS = {
  ok: typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined',
  on: false, sys: [], picked: {}, until: 0, began: 0,

  /* Chrome hands back an empty list on the first call and fires voiceschanged
     later, so this runs on that event AND on every toggle. */
  load: function () {
    if (!TTS.ok) return;
    var all = speechSynthesis.getVoices();
    var en = all.filter(function (v) { return /^en/i.test(v.lang); });
    TTS.sys = en.length ? en : all;
    /* One system voice per sense of humour, so six agents are six people and
       not one person at six pitches. */
    for (var i = 0; i < VOICES.length; i++) {
      TTS.picked[VOICES[i].key] = TTS.sys.length ? TTS.sys[i % TTS.sys.length] : null;
    }
  },

  toggle: function () {
    if (!TTS.ok) return false;
    TTS.on = !TTS.on;
    if (TTS.on) TTS.load(); else speechSynthesis.cancel();
    return TTS.on;
  },

  /* ONE MOUTH FOR THE WHOLE CITY. If somebody is already talking the line is
     DROPPED, never queued: eight agents thinking every ten seconds fill a queue
     faster than it drains, and a backlog means you hear a line long after its
     bubble has gone — the voice and the city stop agreeing. */
  say: function (voiceKey, text) {
    if (!TTS.on || !TTS.ok || !text) return false;
    var now = Date.now();
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      /* ponytail: Chrome can wedge `speaking` on after an interrupted
         utterance, which would kill the feature silently for the whole
         session. 12s is longer than any line here. */
      if (now - TTS.began > 12000) speechSynthesis.cancel();
      return false;
    }
    if (now < TTS.until) return false;          /* a beat between speakers */
    var V = null;
    for (var i = 0; i < VOICES.length; i++) if (VOICES[i].key === voiceKey) V = VOICES[i];
    var u = new SpeechSynthesisUtterance(text);
    var sv = TTS.picked[voiceKey];
    if (sv) u.voice = sv;
    u.rate = V && V.tts ? V.tts.rate : 1;
    u.pitch = V && V.tts ? V.tts.pitch : 1;
    u.volume = 0.9;
    u.onend = u.onerror = function () { TTS.until = Date.now() + 900; };
    TTS.began = now;
    TTS.until = 0;
    try { speechSynthesis.speak(u); } catch (err) { return false; }
    return true;
  }
};
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = function () { TTS.load(); };
}

/* THE STREET GRID.
   Agents used to walk a bezier straight from one building to the next, which is
   why they crossed six blocks like a ghost: nothing in the city was on their
   route, because their route did not know the city was there.

      s.districtLoad[(s.phase[i] === PH.INSIDE ? s.sites[s.cur[i]] : s.sites[s.tgt[i]]).district]++;
      var p3 = i * 3;
      s.prev[p3] = s.pos[p3]; s.prev[p3 + 1] = s.pos[p3 + 1]; s.prev[p3 + 2] = s.pos[p3 + 2];
      var a = s.sites[s.cur[i]], b = s.sites[s.tgt[i]];

      if (s.phase[i] === PH.TRAVEL || s.phase[i] === PH.APPROACH) {
        var near = s.t[i] > 0.86;
        if (near && s.phase[i] === PH.TRAVEL) s.phase[i] = PH.APPROACH;
        var ease = near ? Math.max(0.18, (1 - s.t[i]) / 0.14) : 1;
        s.t[i] += s.speed[i] * dt * ease * (0.6 + s.energy[i] * 0.6);

        if (s.t[i] >= 1) {
          s.t[i] = 1; s.phase[i] = PH.ENTER; s.timer[i] = LIFT_T;
          s.door[s.tgt[i]] = 1;
          s.anchor[p3] = s.pos[p3]; s.anchor[p3 + 1] = GROUND; s.anchor[p3 + 2] = s.pos[p3 + 2];
          emit('enter', i, s.tgt[i], 'entered');
        }
        pathPos(i, s.t[i]);
        s.pos[p3] = _pp[0];
        /* Climb hard, cruise above every roof in the city, come down hard. The
           clamp is what makes it a cruise instead of a lazy parabola that would
           spend the whole trip at the wrong altitude. */
        /* Climb, cruise, descend — a trapezoid, not a sine. A sine spends the
           last five percent of the trip dropping seventy units, which reads as
           a crash rather than a landing; this gives the descent a fifth of the
           journey and eases both ends of it. */
        if (s.fly[i]) {
          var ft = Math.min(1, Math.min(s.t[i], 1 - s.t[i]) / 0.2);
          s.pos[p3 + 1] = GROUND + CRUISE * ft * ft * (3 - 2 * ft);
        } else {
          s.pos[p3 + 1] = GROUND;
        }
        s.pos[p3 + 2] = _pp[1];
        s.scale[i] = 1;

      } else if (s.phase[i] === PH.ENTER) {
        s.timer[i] -= dt;
        var u2 = Math.min(1, 1 - Math.max(0, s.timer[i]) / LIFT_T);
        var sIn = s.sites[s.tgt[i]];
        interiorSlot(i, sIn);
        /* pavement -> lift core -> up the shaft -> out onto the floor. The
           first leg is now a real walk through the entrance, because the agent
           is standing outside the wall rather than already in the lobby. */
        setLegs(s.anchor[p3], GROUND, s.anchor[p3 + 2],
                sIn.x, GROUND, sIn.z,
                sIn.x, _slot[1], sIn.z,
                _slot[0], _slot[1], _slot[2]);
        threeLeg(u2);
        s.pos[p3] = _lp[0]; s.pos[p3 + 1] = _lp[1]; s.pos[p3 + 2] = _lp[2];
        s.scale[i] = 1 - u2 * 0.12;
        if (s.timer[i] <= 0) {
          s.phase[i] = PH.INSIDE;
          s.cur[i] = s.tgt[i];
          s.timer[i] = 3.4 + (s.seed[i] * 8.2);
          s.stay[i] = s.timer[i];
          s.scale[i] = 0.88;
        }

      } else if (s.phase[i] === PH.INSIDE) {
        s.occupancy[s.cur[i]]++;
        s.timer[i] -= dt;
        var rate = (0.055 + s.energy[i] * 0.06) * dt * 6;
        s.prog[i] += rate;
        s.energy[i] = Math.max(0.15, s.energy[i] - dt * 0.012);
        if (s.prog[i] >= 1) {
          s.prog[i] = 0;
          s.skill[i] = Math.min(10, s.skill[i] + 0.12 + s.seed[i] * 0.1);
          s.tasksDone++;
          s.impact += 0.6 + s.skill[i] * 0.12;
          emit('done', i, s.cur[i], 'completed ' + TASKS[s.state[i]][s.task[i]].toLowerCase());
          /* A finished task is the one moment worth interrupting a thought for. */
          var uw = s.userOf(i);
          if (uw) think(uw, 'win', 6);
          if (s.skill[i] > 9.4) emit('skill', i, s.cur[i], 'reached skill ' + s.skill[i].toFixed(1));
        }
        interiorSlot(i, s.sites[s.cur[i]]);
        s.pos[p3] = _slot[0]; s.pos[p3 + 1] = _slot[1]; s.pos[p3 + 2] = _slot[2];
        s.scale[i] = 0.88;
        if (s.timer[i] <= 0) {
          s.phase[i] = PH.EXIT; s.timer[i] = LIFT_T;
          s.door[s.cur[i]] = 1;
          s.anchor[p3] = s.pos[p3]; s.anchor[p3 + 1] = s.pos[p3 + 1]; s.anchor[p3 + 2] = s.pos[p3 + 2];
          s.energy[i] = Math.min(1, s.energy[i] + 0.34);
        }

      } else {
        s.timer[i] -= dt;
        var u3 = Math.min(1, 1 - Math.max(0, s.timer[i]) / LIFT_T);
        var site = s.sites[s.cur[i]];
        /* desk -> lift core on this floor -> down the shaft -> out the door.
           The middle leg is the one that matters: it is vertical and it is
           inside the shaft, instead of a diagonal through four storeys. */
        doorPoint(site.x, site.z, site.w, site.d, _door, 1.1);
        setLegs(s.anchor[p3], s.anchor[p3 + 1], s.anchor[p3 + 2],
                site.x, s.anchor[p3 + 1], site.z,
                site.x, GROUND, site.z,
                _door[0], GROUND, _door[1]);
        threeLeg(u3);
        s.pos[p3] = _lp[0]; s.pos[p3 + 1] = _lp[1]; s.pos[p3 + 2] = _lp[2];
        s.scale[i] = 0.88 + u3 * 0.12;
        if (s.timer[i] <= 0) {
          s.tgt[i] = pickTarget(i);
          newTask(i);
          beginJourney(i);
          emit('depart', i, s.cur[i], 'left for ' + s.sites[s.tgt[i]].label);
        }
      }
    }

    for (var uu = 0; uu < s.users.length; uu++) {
      var u2 = s.users[uu];
      if (u2.thought && s.time > u2.thought.until) u2.thought = null;
      u2.thinkIn -= dt;
      if (u2.thinkIn <= 0 && !u2.thought) think(u2, moodOf(u2.index));
    }

    for (var k = 0; k < s.sites.length; k++) {
      s.door[k] = Math.max(0, s.door[k] - dt * 1.9);
      var target = Math.min(1, s.occupancy[k] / 7);
      s.busy[k] += (target - s.busy[k]) * Math.min(1, dt * 2.4);
      s.work[k] = (s.work[k] + dt * (0.12 + s.busy[k] * 0.5)) % 1;
    }
  }

  s.snapshot = function () {
    var active = 0, live = 0;
    for (var i = 0; i < s.N; i++) {
      if (!s.live[i]) continue;
      live++;
      if (s.state[i] !== ST.IDLE) active++;
    }
    return {
      total: live, active: active,
      counts: Array.prototype.slice.call(s.counts),
      tasksDone: s.tasksDone, impact: s.impact, time: s.time,
      hour: s.dayFrac * 24, night: s.night,
      weather: s.weather.kind, rain: s.weather.rain, fog: s.weather.fog,
      mine: s.users.length
    };
  };
  s.agentInfo = function (i) {
    var u = s.userOf(i);
    return {
      id: 'A' + (0x1000 + i).toString(16).toUpperCase(),
      index: i, mine: !!u,
      name: u ? u.name : null,
      avatar: u ? u.avatar : null,
      voice: u ? u.voice : null,
      voiceName: u ? voiceOf(u.voice).name : null,
      mood: u ? (u.thought ? u.thought.mood : moodOf(i)) : null,
      thought: u && u.thought ? u.thought.text : null,
      roleName: u ? roleName(u.role) : null,
      journey: u ? u.journey : null,
      born: u ? u.born : 0,
      state: STATES[s.state[i]],
      stateIdx: s.state[i],
      phase: ['travelling', 'on approach', 'entering', 'inside', 'leaving'][s.phase[i]],
      location: s.phase[i] === PH.INSIDE ? s.sites[s.cur[i]].label : 'in transit',
      destination: s.sites[s.tgt[i]].label,
      task: TASKS[s.state[i]][s.task[i]],
      progress: s.prog[i], skill: s.skill[i], energy: s.energy[i],
      inside: s.phase[i] === PH.INSIDE,
      floor: s.floorOf(i), floors: s.sites[s.cur[i]].floors
    };
  };
  return s;
}

/* =====================================================================
   /shaders
   ===================================================================== */
var SH = {};

SH.buildingVert = [
  'attribute float aSeed; attribute float aBusy; attribute vec3 aScale; attribute vec3 aTint;',
  'attribute float aOpen;',
  'varying vec2 vUv; varying vec3 vN; varying float vSeed; varying float vBusy;',
  'varying vec3 vTint; varying vec3 vScale; varying float vDepth; varying float vOpen;',
  'void main(){',
  '  vUv = uv; vSeed = aSeed; vBusy = aBusy; vTint = aTint; vScale = aScale; vOpen = aOpen;',
  '  #ifdef USE_INSTANCING',
  '    vec4 ip = instanceMatrix * vec4(position,1.0);',
  '    vN = normalize(mat3(instanceMatrix) * normal);',
  '  #else',
  '    vec4 ip = vec4(position,1.0);',
  '    vN = normal;',
  '  #endif',
  '  vec4 mv = modelViewMatrix * ip;',
  '  vDepth = -mv.z;',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');

SH.buildingFrag = [
  'precision highp float;',
  'uniform float uTime; uniform vec3 uFog; uniform float uFogK; uniform float uNight;',
  'varying vec2 vUv; varying vec3 vN; varying float vSeed; varying float vBusy;',
  'varying vec3 vTint; varying vec3 vScale; varying float vDepth; varying float vOpen;',
  'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }',
  'void main(){',
  '  float material = hash(vec2(vSeed, 41.7));',
  '  vec3 stone = vec3(0.43,0.39,0.32);',
  '  vec3 brick = vec3(0.42,0.23,0.17);',
  '  vec3 teal = vec3(0.19,0.34,0.33);',
  '  vec3 slate = vec3(0.27,0.32,0.39);',
  '  vec3 facade = material < 0.25 ? stone : material < 0.50 ? brick : material < 0.75 ? teal : slate;',
  '  float shade = 0.72 + 0.28 * max(0.0, dot(normalize(vN), normalize(vec3(0.6,0.8,0.4))));',
  '  vec3 col = facade * shade * mix(1.0, 0.28, uNight);',
  '  float up = abs(vN.y);',
  '  if (vOpen > 0.004) {',
  '    if (up > 0.5) { if (vOpen > 0.12) discard; }',
  '    else {',
  '      float slice = fract(vUv.y * vScale.y * 0.24 - uTime * 0.10);',
  '      if (slice < vOpen * 0.82) discard;',
  '    }',
  '  }',
  '  if (up < 0.5) {',
  '    float w = (abs(vN.x) > 0.5) ? vScale.z : vScale.x;',
  '    float cols = max(2.0, floor(w / 2.1));',
  '    float rows = max(3.0, floor(vScale.y / 2.8));',
  '    vec2 g = vec2(vUv.x * cols, vUv.y * rows);',
  '    float aa = fwidth(g.x) + fwidth(g.y);',
  '    float sharp = 1.0 - smoothstep(0.30, 1.10, aa);',
  '    vec2 cell = floor(g); vec2 f = fract(g);',
  '    float onA = hash(cell + vSeed * 19.0);',
  '    float ph  = hash(cell.yx + vSeed * 7.0);',
  /* THE CITY KEEPS ITS NIGHT, so the hour has to be legible in the windows
     instead of the sky. Two thirds of them are dark at midday and most are lit
     after dark — the same trick a real skyline uses to tell you the time. */
  '    float lit = step(mix(0.80, 0.34, uNight), onA);',
  '    float pulse = 0.65;',
  '    lit = max(lit, step(0.72 - vBusy * 0.42, ph) * step(0.55, pulse));',
  '    float pane = step(0.16, f.x) * step(f.x, 0.84) * step(0.18, f.y) * step(f.y, 0.70);',
  '    float win = mix(0.30 * lit, lit * pane, sharp);',
  '    col += vec3(0.72,0.53,0.29) * win * (0.12 + 0.42 * uNight);',
  '    float base = smoothstep(0.06, 0.0, vUv.y);',
  '    col += vTint * base * 0.025;',
  '  } else {',
  '    col *= 0.72;',
  '    vec2 c = vUv - 0.5;',
  '    float bl = 0.5 + 0.5 * sin(uTime * 2.1 + vSeed * 30.0);',
  '    col += vTint * smoothstep(0.10, 0.0, length(c)) * 0.025;',
  '  }',
  '  col += vTint * vOpen * 0.22;',
  '  float fog = 1.0 - exp(-pow(vDepth * uFogK, 2.0));',
  '  col = mix(col, uFog, clamp(fog, 0.0, 1.0));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

/* The walk cycle happens here, not on the CPU. `aLimb` tags each vertex as
   body / left leg / right leg / left arm / right arm, and the limb is swung
   about its own hip or shoulder by a per-instance phase. That is what lets
   900 agents walk with one geometry and one draw call — the alternative is
   a skinned mesh per agent, which is why the old build had them hovering. */
SH.agentVert = [
  'attribute float aPart; attribute float aLimb; attribute vec3 aTint;',
  'attribute float aGlow; attribute float aPhase; attribute float aStride;',
  'varying float vPart; varying vec3 vTint; varying vec3 vN; varying float vGlow; varying float vDepth;',
  'void main(){',
  '  vPart = aPart; vTint = aTint; vGlow = aGlow;',
  '  vec3 p = position; vec3 nn = normal;',
  '  if (aLimb > 0.5) {',
  '    bool isLeg = aLimb < 2.5;',
  '    float side = (aLimb == 1.0 || aLimb == 3.0) ? 1.0 : -1.0;',
  /* arms counter-swing against the legs, which is what stops it reading as a march */
  '    float amp = isLeg ? aStride * 0.62 : aStride * 0.40;',
  '    float ang = sin(aPhase) * side * amp * (isLeg ? 1.0 : -1.0);',
  '    float pivotY = isLeg ? 0.66 : 1.32;',
  '    float c = cos(ang), s = sin(ang);',
  '    vec3 q = p - vec3(0.0, pivotY, 0.0);',
  '    p = vec3(q.x, q.y * c - q.z * s, q.y * s + q.z * c) + vec3(0.0, pivotY, 0.0);',
  '    nn = vec3(nn.x, nn.y * c - nn.z * s, nn.y * s + nn.z * c);',
  '  }',
  '  #ifdef USE_INSTANCING',
  '    vec4 ip = instanceMatrix * vec4(p,1.0);',
  '    vN = normalize(mat3(instanceMatrix) * nn);',
  '  #else',
  '    vec4 ip = vec4(p,1.0); vN = nn;',
  '  #endif',
  '  vec4 mv = modelViewMatrix * ip; vDepth = -mv.z;',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');

/* Floor slabs and desks. Both only exist visually while their building is
   cut open, so the alpha is driven straight off the same open value the
   wall shader uses — no second source of truth for "is this open". */
SH.interiorVert = [
  'attribute float aOpen; attribute vec3 aTint;',
  'varying float vOpen; varying vec3 vTint; varying vec3 vN; varying float vDepth;',
  'void main(){',
  '  vOpen = aOpen; vTint = aTint;',
  '  #ifdef USE_INSTANCING',
  '    vec4 ip = instanceMatrix * vec4(position,1.0);',
  '    vN = normalize(mat3(instanceMatrix) * normal);',
  '  #else',
  '    vec4 ip = vec4(position,1.0); vN = normal;',
  '  #endif',
  '  vec4 mv = modelViewMatrix * ip; vDepth = -mv.z;',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');

SH.interiorFrag = [
  'precision highp float;',
  'varying float vOpen; varying vec3 vTint; varying vec3 vN; varying float vDepth;',
  'void main(){',
  '  if (vOpen < 0.02) discard;',
  '  float up = abs(normalize(vN).y);',
  '  vec3 col = vTint * (0.20 + 0.55 * up);',
  '  float a = vOpen * (0.30 + 0.55 * up);',
  /* Pulled in from 900 now that every building has an inside: with the whole
     city open at once, distant interiors were a grey haze that read as fog
     rather than as rooms. */
  '  a *= smoothstep(620.0, 90.0, vDepth);',
  '  gl_FragColor = vec4(col, a);',
  '}'
].join('\n');

SH.agentFrag = [
  'precision highp float;',
  'varying float vPart; varying vec3 vTint; varying vec3 vN; varying float vGlow; varying float vDepth;',
  'void main(){',
  '  vec3 L = normalize(vec3(0.42, 1.0, 0.55));',
  '  vec3 n = normalize(vN);',
  '  float nd = max(0.0, dot(n, L));',
  '  float rim = pow(1.0 - max(0.0, n.y), 2.4);',
  '  vec3 shell = vec3(0.78,0.86,0.97) * (0.26 + 0.74 * nd);',
  '  shell += vTint * rim * 0.34;',
  '  vec3 emis = vTint * (1.45 + vGlow * 0.65);',
  '  vec3 col = mix(shell, emis, vPart);',
  '  col *= 0.55 + 0.45 * smoothstep(1500.0, 240.0, vDepth);',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

SH.flowVert = [
  'attribute float aT; attribute vec3 aCol; attribute float aRoute;',
  'varying vec3 vCol; varying float vT; varying float vRoute; varying float vDepth;',

SH.pointVert = [

SH.pointFrag = [

SH.groundVert = [

SH.groundFrag = [
  'precision highp float;',
  'uniform float uTime; uniform vec3 uFog; uniform float uFogK; uniform float uWet; uniform float uNight;',

  'varying vec3 vW; varying float vDepth;',
  'float grid(vec2 p, float s, float w){',
  '  vec2 g = abs(fract(p / s - 0.5) - 0.5) / fwidth(p / s);',

  '}',
  'void main(){',
  '  vec3 col = vec3(0.008,0.014,0.028);',
  '  float rr = length(vW.xz);',

     walls, but only as a rule about where nothing may be built — invisible.
     Painting them here costs no geometry and no draw call: the ground already
     knows its own world position, and a lane is just a distance to the nearest
     multiple of the block pitch. */
  '  float lx = abs(mod(vW.x + uStreet * 0.5, uStreet) - uStreet * 0.5);',
  '  float lz = abs(mod(vW.z + uStreet * 0.5, uStreet) - uStreet * 0.5);',
  '  float hw = uLane * 0.5;',
  '  float roadX = 1.0 - smoothstep(hw - 0.7, hw + 0.7, lx);',
  '  float roadZ = 1.0 - smoothstep(hw - 0.7, hw + 0.7, lz);',

  '  float g1 = grid(vW.xz, 12.0, 1.4) * 0.038;',
  '  float g2 = grid(vW.xz, 60.0, 1.1) * 0.085;',
  /* the survey grid belongs to the ground between the blocks, not the tarmac */
  '  g1 *= 1.0 - road * 0.94; g2 *= 1.0 - road * 0.94;',
  /* Wet deck: the grid it already draws is the thing a wet street reflects, so
